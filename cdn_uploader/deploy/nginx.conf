# nginx site for cdn.unit.travel
#
#   /f/...          stored files, served by nginx as inert static bytes
#   /api/, /uploader/, /sdk/   proxied to the Python app on 127.0.0.1:8000
#
# Mount the storage volume with noexec,nosuid,nodev. Nothing under /f/ is
# ever passed to PHP/CGI/proxy: there is no such handler on this host.

limit_req_zone $binary_remote_addr zone=unit_upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=unit_api:10m rate=10r/s;

upstream unit_uploader {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.unit.travel;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1 may use "listen 443 ssl;" + "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.unit.travel;

    ssl_certificate     /etc/letsencrypt/live/cdn.unit.travel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.unit.travel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    autoindex off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- stored files -----------------------------------------------------
    location /f/ {
        root /srv/unit-cdn;            # UPLOADER_STORAGE_DIR=/srv/unit-cdn/f
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        types { }
        default_type application/octet-stream;

        # Images and videos may be shown inline (<img>, <video>), in a
        # sandboxed context. Range requests (video seeking) work out of the box.
        location ~ "^/f/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{64}\.(jpg|png|gif|webp|mp4|webm)$" {
            types {
                image/jpeg jpg;
                image/png  png;
                image/gif  gif;
                image/webp webp;
                video/mp4  mp4;
                video/webm webm;
            }
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Everything else is always downloaded, never rendered by the browser.
        location ~ "^/f/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{64}\.(pdf|docx|xlsx|pptx|odt|ods|odp|txt|csv|zip|tar|tar\.gz)$" {
            types {
                application/pdf pdf;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
                application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
                application/vnd.oasis.opendocument.text odt;
                application/vnd.oasis.opendocument.spreadsheet ods;
                application/vnd.oasis.opendocument.presentation odp;
                text/plain txt;
                text/csv csv;
                application/zip zip;
                application/x-tar tar;
                application/gzip gz;
            }
            charset utf-8;
            charset_types text/plain text/csv;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Content-Disposition "attachment" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        return 404;
    }

    # ---- uploader app -------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/files {
        limit_except POST { deny all; }
        client_max_body_size 501m;     # max(UPLOADER_MAX_FILE_MB, UPLOADER_MAX_VIDEO_MB) + headroom
        client_body_timeout 120s;
        client_body_temp_path /srv/unit-cdn/nginx-body;
        proxy_request_buffering on;    # slow clients never tie up the app
        proxy_read_timeout 120s;       # videos are processed in the background
        limit_req zone=unit_upload burst=50 nodelay;
        proxy_pass http://unit_uploader;
    }

    location /api/ {
        limit_req zone=unit_api burst=20 nodelay;
        proxy_pass http://unit_uploader;
    }

    location /uploader/ {
        limit_req zone=unit_api burst=20 nodelay;
        proxy_pass http://unit_uploader;
    }

    location = /sdk/unit-uploader.js {
        proxy_pass http://unit_uploader;
    }

    location / {
        return 404;
    }
}
