<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Otter">
<meta name="theme-color" content="#0a3653">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Caspian Otter Adventure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@700;800;900&display=swap">
<style>
/* Layout: a full-bleed mountain-river canvas fills the screen; chunky ink-outlined "sticker" cards, pills and buttons float above it */
:root{
  --ink:#1b2a44;
  --paper:#fff7e8;
  --paper-deep:#ffe9c4;
  --river:#1b8fb8;
  --deep:#0a3653;
  --gold:#ffc83d;
  --gold-deep:#e0950a;
  --leaf:#35b263;
  --leaf-pale:#dbf8e3;
  --coral:#ff6a5a;
  --coral-pale:#ffe1dc;
  --sky:#6fdcf0;
  --sky-deep:#2aa6c6;
  --text-soft:#34425e;
  --white:#ffffff;
  --font-display:"Rubik","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--deep)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--font-body);font-weight:700;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:40}

.ink-text{text-shadow:.05em 0 0 var(--ink),-.05em 0 0 var(--ink),0 .05em 0 var(--ink),0 -.05em 0 var(--ink),.036em .036em 0 var(--ink),-.036em .036em 0 var(--ink),.036em -.036em 0 var(--ink),-.036em -.036em 0 var(--ink),0 .1em 0 var(--ink)}

/* buttons */
.btn{--b:var(--gold);--bd:var(--gold-deep);appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:54px;padding:.6em 1.25em .66em;font:800 clamp(19px,2.5vmax,26px)/1 var(--font-display);letter-spacing:.01em;color:var(--ink);background:var(--b);border:3px solid var(--ink);border-radius:999px;box-shadow:inset 0 -5px 0 var(--bd),0 5px 0 var(--ink);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 var(--bd),0 1px 0 var(--ink)}
.btn svg{width:1.05em;height:1.05em;flex:none}
.btn.big{font-size:clamp(26px,3.6vmax,40px);padding:.5em 1.4em .56em}
.btn.teal{--b:var(--sky);--bd:var(--sky-deep)}
.btn.green{--b:#7be08f;--bd:#3aa85a}
.btn.white{--b:var(--white);--bd:#d4e3ec}
.icon-btn{width:54px;height:54px;flex:none;display:grid;place-items:center;padding:0;border-radius:50%;border:3px solid var(--ink);background:var(--white);box-shadow:inset 0 -4px 0 #cfe0ea,0 4px 0 var(--ink);cursor:pointer;color:var(--ink);transition:transform .08s ease,box-shadow .08s ease}
.icon-btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 #cfe0ea,0 1px 0 var(--ink)}
.icon-btn svg{width:26px;height:26px}
.btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.answer:focus-visible,.dots button:focus-visible{outline:4px solid var(--white);outline-offset:3px}

/* title screen */
#title{position:absolute;inset:0;z-index:10;pointer-events:none}
.title-col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px;text-align:center;padding-block:calc(env(safe-area-inset-top,0px) + 84px) calc(env(safe-area-inset-bottom,0px) + 30px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.title-col>*{pointer-events:auto}
.title-block{display:flex;flex-direction:column;align-items:center;gap:12px}
.title-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (min-aspect-ratio:23/20){
  .title-col{right:auto;width:min(60%,680px);align-items:flex-start;justify-content:center;text-align:left;padding-left:max(5vw,env(safe-area-inset-left,0px));gap:28px}
  .title-block{align-items:flex-start}
  .title-actions{justify-content:flex-start}
}
.latin{display:inline-block;font:italic 800 clamp(13px,1.8vmin,17px)/1 var(--font-body);letter-spacing:.03em;color:var(--ink);background:rgba(255,255,255,.9);border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px}
.logo{margin:0;font:900 clamp(44px,9.4vmin,104px)/.94 var(--font-display);color:var(--white);letter-spacing:.005em}
.logo.long{font-size:clamp(36px,7.4vmin,84px)}
.logo .row{display:block;white-space:nowrap}
.logo .row.a{color:var(--gold)}
.logo .ch{display:inline-block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.07em) rotate(-3deg)}}
.sticker{display:inline-block;margin-top:.1em;font:900 clamp(22px,3.9vmin,42px)/1 var(--font-display);color:var(--white);background:var(--coral);border:3px solid var(--ink);border-radius:16px;padding:.16em .55em .22em;transform:rotate(-4deg);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.lead{margin:0;max-width:28ch;font:800 clamp(18px,2.7vmin,24px)/1.3 var(--font-body);color:var(--white)}
.corner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;pointer-events:auto}
.seg{display:flex;background:var(--white);border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.seg button{min-width:56px;min-height:48px;padding:0 14px;border:0;background:transparent;font:800 19px/1 var(--font-display);cursor:pointer;color:var(--ink)}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold)}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-group{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 16px 0 10px;background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);font:800 25px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.pill svg{width:30px;height:30px;flex:none}
.stars{display:flex;gap:1px;padding:0 12px}
.stars svg{width:21px;height:21px}
.stars svg path,.res-stars svg path{fill:#d9e6ee;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.stars svg.on path,.res-stars svg.on path{fill:var(--gold)}
.stars svg.on{animation:starpop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes starpop{0%{transform:scale(.2) rotate(-90deg)}100%{transform:none}}
.airbar{width:clamp(64px,10vw,130px);height:16px;border:2.5px solid var(--ink);border-radius:999px;background:#d6eef6;overflow:hidden}
.airbar i{display:block;height:100%;width:100%;background:linear-gradient(#9af2ff,#22acd6);transform-origin:left center}
.pill.low{animation:lowpulse .45s ease-in-out infinite alternate}
.pill.low .airbar i{background:linear-gradient(#ffb6ab,#ff5141)}
.pill.champ .airbar{border-color:var(--gold-deep);box-shadow:0 0 0 3px var(--gold)}
@keyframes lowpulse{to{transform:scale(1.08)}}
#btn-pause{pointer-events:auto}
.hint{position:absolute;left:0;right:0;top:24%;z-index:6;text-align:center;font:900 clamp(26px,4.4vmin,44px)/1.15 var(--font-display);color:var(--white);pointer-events:none;opacity:0;transform:translateY(12px) scale(.96);transition:opacity .25s,transform .25s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint.show{opacity:1;transform:none}
.hint.warn{color:#ffd2cb}

/* overlays & cards */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(4,30,50,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.card{position:relative;max-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink),0 30px 60px rgba(0,0,0,.35);animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:translateY(30px) scale(.84) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0;font:900 clamp(30px,5vmin,48px)/1.03 var(--font-display);text-wrap:balance;color:var(--ink)}
.eyebrow{font:800 clamp(14px,2vmin,17px)/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--river)}
.mascot{display:block;flex:none;width:clamp(104px,18vmin,164px);height:clamp(104px,18vmin,164px)}

.fact-card{width:min(1000px,100%);display:grid;grid-template-columns:minmax(0,1fr)}
.fact-art{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--deep);border-bottom:4px solid var(--ink)}
.fact-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (min-aspect-ratio:23/20) and (min-width:700px){
  .fact-card{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .fact-art{aspect-ratio:auto;min-height:min(330px,58vh);border-bottom:0;border-right:4px solid var(--ink)}
}
.chip{position:absolute;left:14px;top:14px;z-index:1;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:8px 14px 9px;font:800 17px/1 var(--font-display);letter-spacing:.02em;box-shadow:0 3px 0 var(--ink)}
.art-close{position:absolute;right:12px;top:12px;z-index:2}
.fact-body{display:flex;flex-direction:column;gap:16px;padding:clamp(20px,3.4vmin,36px);min-width:0}
.fact-body p{margin:0;font:800 clamp(21px,3.1vmin,29px)/1.36 var(--font-body);color:var(--text-soft);text-wrap:pretty}
.bonus{display:flex;gap:10px;align-items:center;background:var(--leaf-pale);border:3px dashed var(--leaf);border-radius:16px;padding:10px 14px;font:800 clamp(16px,2.3vmin,20px)/1.25 var(--font-body);color:#15603a}
.bonus svg{width:28px;height:28px;flex:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.book-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:auto;padding-top:4px}
.book-nav .mid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots button{width:15px;height:15px;padding:0;border-radius:50%;border:2.5px solid var(--ink);background:var(--white);cursor:pointer}
.dots button[aria-current="true"]{background:var(--gold);transform:scale(1.2)}

.howto-card{width:min(760px,100%);padding:clamp(20px,3.4vmin,34px);display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;gap:18px;align-items:center}
.how-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-aspect-ratio:23/20){.how-list{grid-template-columns:repeat(2,minmax(0,1fr))}.how-list li:last-child{grid-column:1/-1}.howto-card{width:min(900px,100%)}}
.how-list li{display:flex;gap:14px;align-items:center;min-width:0;font:800 clamp(17px,2.7vmin,23px)/1.22 var(--font-body);background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:6px 14px 6px 6px}
.how-ico{width:58px;height:58px;flex:none;border-radius:13px;border:2.5px solid var(--ink);background:linear-gradient(#5fc8e6,#1a7fab)}

.pause-card{width:min(440px,100%);padding:30px;display:flex;flex-direction:column;gap:14px;text-align:center}
.pause-card .btn{width:100%}

.complete-card{width:min(660px,100%);padding:clamp(22px,3.6vmin,38px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.complete-card p,.results-card p{margin:0;font:800 clamp(19px,2.9vmin,26px)/1.3 var(--font-body);color:var(--text-soft)}

.quiz-card{width:min(880px,100%);padding:clamp(18px,3vmin,32px);display:flex;flex-direction:column;gap:18px}
.quiz-q{margin:8px 0 0;font:900 clamp(25px,4.3vmin,42px)/1.1 var(--font-display);text-wrap:balance}
.answers{display:grid;gap:12px}
.answer{display:flex;gap:14px;align-items:center;width:100%;min-height:66px;padding:12px 18px;text-align:left;font:800 clamp(19px,3vmin,27px)/1.2 var(--font-body);background:var(--white);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;color:var(--ink);transition:transform .08s,box-shadow .08s,background-color .2s,opacity .2s}
.answer:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.answer .key{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--paper-deep);border:3px solid var(--ink);font:900 19px/1 var(--font-display)}
.answer.correct{background:var(--leaf-pale)}
.answer.correct .key{background:var(--leaf);color:var(--white)}
.answer.wrong{background:var(--coral-pale);animation:shake .45s}
.answer.wrong .key{background:var(--coral);color:var(--white)}
.answer.dim{opacity:.5}
.answer:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:58px}
.feedback{font:900 clamp(20px,3vmin,28px)/1.2 var(--font-display);min-width:0;flex:1 1 200px}
.feedback.good{color:#1f8a4a}
.feedback.bad{color:#c63d32}

.results-card{width:min(780px,100%);padding:clamp(20px,3.4vmin,36px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.res-stars{display:flex;gap:10px}
.res-stars svg{width:clamp(50px,9vmin,78px);height:clamp(50px,9vmin,78px)}
.res-stars svg.on{animation:starpop .7s cubic-bezier(.2,1.8,.4,1) both}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--white);border:3px solid var(--ink);border-radius:18px;min-width:0}
.stat b{font:900 clamp(28px,4.6vmin,40px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font:800 clamp(13px,1.9vmin,16px)/1.2 var(--font-body);color:var(--text-soft)}
.row-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

@media (prefers-reduced-motion:reduce){
  .logo .ch,.card,.stars svg.on,.res-stars svg.on,.pill.low,.answer.wrong{animation:none}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Caspian otter river game"></canvas>

  <!-- TITLE -->
  <div id="title">
    <div class="corner">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      </div>
      <button type="button" class="icon-btn sound-btn" id="btn-sound-title" aria-label="Sound"></button>
      <button type="button" class="icon-btn" id="btn-fs" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="title-col">
      <div class="title-block">
        <span class="latin" data-i="latin">Lutra lutra meridionalis</span>
        <h1 class="logo ink-text" id="logo"></h1>
        <span class="sticker" data-i="sticker">Adventure</span>
        <p class="lead ink-text" data-i="lead"></p>
      </div>
      <div class="title-actions">
        <button type="button" class="btn big" id="btn-play">
          <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-i="play">Play</span>
        </button>
        <button type="button" class="btn teal" id="btn-book">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M3 5.5c3-1.5 6-1.5 9 .5 3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg>
          <span data-i="book">Fact Book</span>
        </button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div class="hud-group">
      <div class="pill" aria-label="Fish">
        <svg viewBox="0 0 40 26" aria-hidden="true"><path d="M3 13c6-9 17-10 25-4l8-6v20l-8-6C20 23 9 22 3 13z" fill="#ffb347" stroke="#1b2a44" stroke-width="2.6" stroke-linejoin="round"/><circle cx="11" cy="11.5" r="2.3" fill="#1b2a44"/></svg>
        <span id="hud-fish">0</span>
      </div>
      <div class="pill" aria-label="Trash">
        <svg viewBox="0 0 26 40" aria-hidden="true"><path d="M10 7h6v4.5c4 2 5 5 5 8V34a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V19.5c0-3 1-6 5-8z" fill="#a8ecfa"/><path d="M5.5 22h15v7h-15z" fill="#35b263"/><path d="M10 7h6v4.5c4 2 5 5 5 8V34a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V19.5c0-3 1-6 5-8z" fill="none" stroke="#1b2a44" stroke-width="2.6" stroke-linejoin="round"/><rect x="9" y="2.5" width="8" height="5" rx="1.5" fill="#ff6a5a" stroke="#1b2a44" stroke-width="2.2"/></svg>
        <span id="hud-trash">0</span>
      </div>
    </div>
    <div class="pill stars" id="hud-stars" aria-label="Facts found"></div>
    <div class="hud-group">
      <div class="pill" id="air-pill" aria-label="Air">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="#c8f4ff" stroke="#1b2a44" stroke-width="2.6"/><path d="M10 14a7 7 0 0 1 5-5.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <div class="airbar"><i id="air-fill"></i></div>
      </div>
      <button type="button" class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <div class="hint ink-text" id="hint" aria-live="polite"></div>

  <!-- HOW TO -->
  <div class="overlay" id="howto" hidden>
    <div class="card howto-card" role="dialog" aria-modal="true" aria-labelledby="howto-title">
      <div class="card-head">
        <canvas class="mascot" id="howto-mascot"></canvas>
        <h2 id="howto-title" data-i="howTitle">How to play</h2>
      </div>
      <ul class="how-list" id="how-list"></ul>
      <div class="actions"><button type="button" class="btn big green" id="btn-start" data-i="start">Let's swim!</button></div>
    </div>
  </div>

  <!-- FACT -->
  <div class="overlay" id="fact" hidden>
    <div class="card fact-card" role="dialog" aria-modal="true" aria-labelledby="fact-title">
      <div class="fact-art">
        <canvas id="fact-canvas"></canvas>
        <div class="chip" id="fact-chip">Fact 1 of 10</div>
        <button type="button" class="icon-btn art-close" id="fact-close" aria-label="Close" hidden>

function pickVoice(){ if(!canSpeak) return null; const vs=speechSynthesis.getVoices()||[]; const want=lang==='ru'?'ru':'en'; const list=vs.filter(v=>(v.lang||'').toLowerCase().startsWith(want)); return list.find(v=>/samantha|karen|daniel|milena|yuri|google/i.test(v.name))||list[0]||null; }

function speak(text){
  if(!canSpeak) return; stopSpeech();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang==='ru'?'ru-RU':'en-GB'; const v=pickVoice(); if(v) u.voice=v; u.rate=.9; u.pitch=1.08;

  const pw=34, j0=Math.floor(G.scroll/pw)-1, j1=Math.floor((G.scroll+W)/pw)+1;
  for(let i=j0;i<=j1;i++){ if(hash(i*1.37)>.55) continue; const x=i*pw-G.scroll+hash(i*2.11)*24, y=bedY(x)+9+hash(i*5.3)*30, r=4+hash(i*9.1)*10;
    c.fillStyle=PEB[(hash(i*4.4)*4)|0]; ell(c,x,y,r,r*.62); c.fill(); c.fillStyle='rgba(255,255,255,.22)'; ell(c,x-r*.25,y-r*.22,r*.45,r*.22); c.fill(); }
}
function drawFore(c){
  const off=G.scroll*1.3, cw=540, i0=Math.floor(off/cw)-1, i1=Math.floor((off+W)/cw)+1; c.lineCap='round';
  for(let i=i0;i<=i1;i++){ const h=hash(i*9.71); if(h>.5) continue; const x=i*cw-off+hash(i*3.3)*200;
    c.fillStyle='#0f4a5e'; c.beginPath();
    for(let j=0;j<5;j++){ const hh=Math.min(VH-G.surf-150,80+hash(i*2+j)*100), bx=x-44+j*22, sw=Math.sin(G.t*1.1+i+j*1.3)*hh*.16+(j-2)*14; blade(c,bx,VH+10,hh,sw,13); }
    c.fill(); c.fillStyle='#0c3a4f'; ell(c,x,VH+8,70+h*60,34+h*20); c.fill(); }

function drawTint(c){ waterPath(c); const k=G.scene==='game'?0:.18, g=c.createLinearGradient(0,G.surf,0,VH); g.addColorStop(0,`rgba(20,120,170,${.12+k})`); g.addColorStop(1,`rgba(3,28,55,${.42+k*.5})`); c.fillStyle=g; c.fill(); }
function drawSurface(c){
  c.beginPath(); for(let x=-20;x<=W+20;x+=16) c.lineTo(x,surfY(x)); c.strokeStyle='rgba(255,255,255,.88)'; c.lineWidth=3.5; c.lineJoin='round'; c.stroke();
  c.strokeStyle='#fff'; c.lineWidth=2; c.lineCap='round'; const span=W+100;
  for(let i=0;i<8;i++){ const x=wrap(i*173-G.scroll*.6+Math.sin(G.t+i)*10,span)-50, y=surfY(x)+7+(i%3)*5; c.globalAlpha=.25+.45*(.5+.5*Math.sin(G.t*2+i*1.3)); c.beginPath(); c.moveTo(x-10,y); c.lineTo(x+10,y); c.stroke(); }
  c.globalAlpha=1;

// ================= game logic =================
function newOtter(x,y){ return {x,y,vx:0,vy:0,ang:0,flip:false,ph:0,swimA:.8,chomp:0,hurt:0,invul:0,blink:0,blinkT:2,noAir:false,atSurf:false,bubT:0}; }
function headPos(){ const o=G.otter, s=OTTER_S, d=o.flip?-1:1, lx=62*d*s, ly=-4*s, ca=Math.cos(o.ang), sa=Math.sin(o.ang); return [o.x+lx*ca-ly*sa,o.y+lx*sa+ly*ca]; }
function bodyPos(){ const o=G.otter, d=o.flip?-1:1, lx=-45*d*OTTER_S; return [o.x+lx*Math.cos(o.ang),o.y+lx*Math.sin(o.ang)]; }
const dist=(a,b,x,y)=>Math.hypot(a-x,b-y);
function bubble(x,y,r){ return {k:'bub',x,y,r,ph:Math.random()*6,life:8,max:8}; }
function pop(txt,x,y,col){ G.pops.push({txt,x,y,col,life:1.2}); }
function burst(x,y,n,kind){ for(let i=0;i<n;i++){ if(kind==='spark') G.parts.push({k:'spark',x,y,vx:rnd(-280,280),vy:rnd(-280,280),life:rnd(.5,.9),max:.9,r:rnd(5,12),col:pick(['#fff4b0','#ffd34d','#ffffff'])}); else G.parts.push(bubble(x+rnd(-12,12),y+rnd(-10,10),rnd(2,6))); } }
function splash(x,n=14){ const y=surfY(x); for(let i=0;i<n;i++) G.parts.push({k:'drop',x:x+rnd(-20,20),y,vx:rnd(-160,160),vy:rnd(-380,-150),r:rnd(3,7),life:1.6,max:1.6}); G.parts.push({k:'ring',x,y,r:10,life:.8,max:.8}); G.parts.push({k:'ring',x,y,r:2,life:1.1,max:1.1}); }
function spawnSchool(){ const n=rint(3,5), type=rint(0,3), y0=rnd(G.surf+80,VH-140), v=rnd(25,70); for(let i=0;i<n;i++) G.fish.push({x:W+40+i*42+rnd(0,26),y:y0+rnd(-42,42),v,type,s:rnd(.9,1.15),ph:rnd(0,6),wig:rnd(1.5,2.5)}); }
function spawnPearl(){ G.pearls.push({x:W+70,y0:rnd(G.surf+100,VH-160),y:0,ph:rnd(0,6),r:34}); Snd.play('appear'); if(!G.hintsShown.fact){ G.hintsShown.fact=1; showHint('fact',3); } }
function spawnHook(){ if(G.pearls.some(p=>p.x>W-240)){ G.timers.hook=1.4; return; } G.hooks.push({x:W+40,depth:rnd(G.surf+130,VH-170),ph:rnd(0,6),hy:0}); if(!G.hintsShown.hook){ G.hintsShown.hook=1; showHint('hook',2.6,true); } }
function spawnTrash(){ const fl=Math.random()<.4; G.trash.push({x:W+40,y:fl?G.surf+6:rnd(G.surf+90,VH-140),float:fl,kind:rint(0,2),rot:rnd(-1,1),vr:rnd(-.6,.6),ph:rnd(0,6)}); }

function resetGame(){
  G.trash=[];G.hooks=[];G.crays=[];G.pearls=[];G.pops=[];
  G.found=0;G.fishN=0;G.trashN=0;G.air=100;G.boost=0;G.radar=false;G.fins=false;G.champ=false;G.shake=0;G.quiz=null;
  G.timers={fish:.6,trash:4.5,hook:6,cray:7,pearl:2.2,radar:0,amb:0};
  G.hintsShown={}; G.otter=newOtter(-170,520); hud(); airHud();
}
function eat(f,pts){ f.dead=true; G.fishN+=pts; G.otter.chomp=1; pop('+'+pts,f.x,f.y-14,'#ffe27a'); Snd.play(pts>1?'crunch':'chomp'); burst(f.x,f.y,5,'bub'); hud(); }
function hurt(){
  const o=G.otter; if(o.invul>0) return; o.invul=1.8; o.hurt=.7;
  const lost=Math.min(3,G.fishN); G.fishN-=lost; pop(T().ui.ouch+(lost?' -'+lost:''),o.x,o.y-50,'#ff9a8a');
  G.shake=.45; Snd.play('ouch'); o.x-=50; hud();
}
function updateFish(dt,sp,play){
  const H=play?headPos():null;
  for(const f of G.fish){ f.x-=(sp+f.v)*dt; f.ph+=dt*f.wig; f.y+=Math.cos(f.ph)*14*dt;
    if(play){ const dx=f.x-H[0], dy=f.y-H[1], d=Math.hypot(dx,dy); if(d<110&&d>1) f.y+=dy/d*32*dt; if(d<36) eat(f,1); }
    f.y=clamp(f.y,G.surf+30,VH-90); }
  G.fish=G.fish.filter(f=>!f.dead&&f.x>-90);
}
function updateParts(dt,sp){
  const damp=Math.pow(.05,dt);
  for(const p of G.parts){
    switch(p.k){
      case 'bub': p.y-=(30+p.r*9)*dt; p.x+=Math.sin(G.t*3+p.ph)*12*dt-sp*dt*.85; p.life-=dt; if(p.y<surfY(p.x)+2) p.life=0; break;
      case 'drop': p.vy+=950*dt; p.x+=p.vx*dt-sp*dt*.5; p.y+=p.vy*dt; p.life-=dt; if(p.vy>0&&p.y>surfY(p.x)) p.life=0; break;
      case 'spark': p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=damp; p.vy*=damp; p.life-=dt; break;
      case 'ring': p.r+=70*dt; p.x-=sp*dt; p.life-=dt; break;
      case 'radar': p.r+=300*dt; p.life-=dt; break;
      case 'speed': p.x-=1200*dt; p.life-=dt; break;
    }
  }
  G.parts=G.parts.filter(p=>p.life>0&&p.x>-140);
  if(G.parts.length>260) G.parts.splice(0,G.parts.length-260);
  for(const p of G.pops){ p.y-=46*dt; p.life-=dt; }
  G.pops=G.pops.filter(p=>p.life>0);
}
function updateAmbient(dt,sp){
  G.t+=dt; G.scroll+=sp*dt;
  if((G.timers.amb-=dt)<=0){ G.timers.amb=rnd(2.5,4.5); spawnSchool(); }
  if(Math.random()<dt*2){ const x=rnd(0,W); G.parts.push(bubble(x,bedY(x)-4,rnd(2,5))); }
  updateFish(dt,sp,false); updateParts(dt,sp);
}
function updateDive(dt){
  G.diveT+=dt; const d=G.diveT;
  updateAmbient(dt,28+clamp(d/1.6,0,1)*120);
  if(d<.2) G.title.dy=-34*Math.sin(d/.2*Math.PI/2); else if(d<.5) G.title.dy=-34+(d-.2)/.3*300; else G.title.hidden=true;
  if(!G.diveSplash&&d>.3){ G.diveSplash=true; splash(G.title.x,22); Snd.play('splash'); }
  G.surf=lerp(G.surfTitle,SURF_GAME,easeIO(clamp((d-.45)/1.15,0,1)));
  const o=G.otter, q=easeIO(clamp((d-.8)/.95,0,1)); o.x=lerp(-170,W*.3,q); o.y=lerp(520,400,q); o.ph+=dt*8; o.swimA=.9; o.ang=lerp(-.2,0,q);
  G.target.x=o.x; G.target.y=o.y;
  if(d>=1.85){ if(!G.howtoSeen) openHowto(); else beginPlay(); }
}
function updatePlay(dt){
  const o=G.otter, TM=G.timers;
  G.t+=dt;
  if(G.boost>0){ G.boost-=dt; if(Math.random()<dt*28) G.parts.push({k:'speed',x:W+20,y:rnd(G.surf+20,VH-60),len:rnd(40,120),life:.9,max:.9}); }
  const sp=(150+G.found*7)*(G.boost>0?1.7:1);
  G.scroll+=sp*dt;
  // control
  const kx=(G.keys.ArrowRight?1:0)-(G.keys.ArrowLeft?1:0), ky=(G.keys.ArrowDown?1:0)-(G.keys.ArrowUp?1:0);
  if(kx||ky){ G.target.x=o.x+kx*140; G.target.y=o.y+ky*140; }
  let tx=G.target.x, ty=G.target.y; if(o.noAir) ty=G.surf-30;
  tx=clamp(tx,70,W-110); ty=clamp(ty,G.surf-12,VH-95);
  const k=1-Math.exp(-dt*(G.fins?7.5:5.5));
  let dx=(tx-o.x)*k, dy=(ty-o.y)*k; const maxD=(G.fins?660:520)*dt, d=Math.hypot(dx,dy); if(d>maxD){dx*=maxD/d; dy*=maxD/d;}
  o.vx=dt>0?dx/dt:0; o.vy=dt>0?dy/dt:0; o.x+=dx; o.y+=dy;
  if(o.vx<-150) o.flip=true; else if(o.vx>40) o.flip=false;
  const atSurf=o.y<G.surf+16;
  const tAng=atSurf?0:clamp((o.flip?-1:1)*Math.atan2(o.vy,Math.abs(o.vx)+sp*.6),-.7,.7);
  o.ang+=(tAng-o.ang)*(1-Math.exp(-dt*8));
  const spd=Math.hypot(o.vx,o.vy);
  o.swimA+=((atSurf?.35:clamp(.5+spd/500,.5,1))-o.swimA)*(1-Math.exp(-dt*4));
  o.ph+=dt*(5+spd/60+(G.boost>0?5:0));
  o.chomp=Math.max(0,o.chomp-dt*5); o.hurt=Math.max(0,o.hurt-dt); o.invul=Math.max(0,o.invul-dt);
  if((o.blinkT-=dt)<=0){ o.blink=.13; o.blinkT=rnd(2.5,5); } o.blink-=dt;
  // air
  if(atSurf){ if(!o.atSurf){ splash(o.x+20,8); Snd.play('breath'); } G.air=Math.min(100,G.air+60*dt); if(o.noAir&&G.air>45) o.noAir=false; }
  else { if(o.atSurf&&o.vy>60) splash(o.x,6); G.air-=(G.champ?4.2:6.5)*dt;
    if(G.air<=0){ G.air=0; if(!o.noAir){ o.noAir=true; const lost=Math.min(2,G.fishN); G.fishN-=lost; Snd.play('ouch'); pop(T().ui.hints.noAir,o.x,o.y-50,'#ff9a8a'); hud(); } }
    if((o.bubT-=dt)<=0){ o.bubT=rnd(.35,.8); const H=headPos(); G.parts.push(bubble(H[0],H[1]-6,rnd(2,4.5))); } }
  o.atSurf=atSurf;
  if(o.noAir) showHint('noAir',.25,true); else if(G.air<30&&!atSurf) showHint('air',.25,true);
  if(G.radar&&(TM.radar-=dt)<=0){ TM.radar=3.2; const H=headPos(); G.parts.push({k:'radar',x:H[0],y:H[1],r:12,life:1,max:1,a:(o.flip?Math.PI:0)+o.ang}); }
  // spawns
  if((TM.fish-=dt)<=0){ TM.fish=rnd(1.6,2.8); spawnSchool(); }
  if((TM.trash-=dt)<=0){ TM.trash=rnd(6,10); spawnTrash(); }
  if(G.found>=1&&(TM.hook-=dt)<=0){ TM.hook=rnd(5.5,8.5)-Math.min(2,G.found*.2); spawnHook(); }
  if((TM.cray-=dt)<=0){ TM.cray=rnd(9,14); G.crays.push({x:W+60,y:0,ph:rnd(0,6)}); }
  if(!G.pearls.length&&G.found<10&&(TM.pearl-=dt)<=0) spawnPearl();
  // entities
  const H=headPos(), B=bodyPos();
  updateFish(dt,sp,true);
  for(const cr of G.crays){ cr.x-=(sp+14)*dt; cr.y=bedY(cr.x)-6; if(dist(H[0],H[1],cr.x,cr.y)<42){ cr.dead=true; eat(cr,3); } }
  G.crays=G.crays.filter(c=>!c.dead&&c.x>-90);
  for(const tr of G.trash){ tr.x-=sp*dt; tr.rot+=tr.vr*dt; if(tr.float) tr.y=surfY(tr.x)+6; else tr.y+=Math.sin(G.t*1.5+tr.ph)*8*dt;
    if(dist(H[0],H[1],tr.x,tr.y)<40||dist(B[0],B[1],tr.x,tr.y)<30){ tr.dead=true; G.trashN++; pop('+1 '+T().ui.clean,tr.x,tr.y-20,'#a6f7c2'); burst(tr.x,tr.y,10,'spark'); Snd.play('trash'); hud(); } }
  G.trash=G.trash.filter(t=>!t.dead&&t.x>-80);
  for(const h of G.hooks){ h.x-=sp*dt; h.hy=h.depth+Math.sin(G.t*1.3+h.ph)*40; if(dist(H[0],H[1],h.x-4,h.hy+6)<28||dist(B[0],B[1],h.x-4,h.hy+6)<30) hurt(); }
  G.hooks=G.hooks.filter(h=>h.x>-80);
  for(const p of G.pearls){ p.x-=sp*.9*dt; p.y=p.y0+Math.sin(G.t*2+p.ph)*14;
    if(dist(H[0],H[1],p.x,p.y)<54||dist(B[0],B[1],p.x,p.y)<46){ p.got=true; burst(p.x,p.y,22,'spark'); Snd.play('sparkle'); G.found++; hud(); openFact(G.found-1,'play'); } }
  if(G.pearls.some(p=>!p.got&&p.x<-70)) TM.pearl=1.2;
  G.pearls=G.pearls.filter(p=>!p.got&&p.x>=-70);
  updateParts(dt,sp);
  G.shake=Math.max(0,G.shake-dt*1.6);
  airHud(); tickHint(dt);
}

// ================= render =================
function drawPlayer(c){
  const o=G.otter; if(!o) return;
  const alpha=o.invul>0&&Math.floor(o.invul*12)%2===0?.45:1;
  otterSide(c,{x:o.x,y:o.y,s:OTTER_S,ang:o.ang,flip:o.flip,t:o.ph,swim:o.swimA,glow:G.radar,chomp:o.chomp,blink:o.blink>0,eye:o.hurt>0?'closed':null,alpha});
  if(o.hurt>0){ const H=headPos(); c.fillStyle='#fff6a0'; for(let i=0;i<3;i++){ const a=G.t*6+i*TAU/3; sparkle(c,H[0]-10+Math.cos(a)*26,H[1]-30+Math.sin(a)*8,7); c.fill(); } }
}
function drawTitleOtter(c){
  if(G.title.hidden) return; const s=G.wide?1.05:1.1, x=G.title.x, y=G.surf-36*s+Math.sin(G.t*1.8)*4+G.title.dy;
  c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=3; c.beginPath(); c.ellipse(x,G.surf+3,96*s,11*s,0,Math.PI,TAU); c.stroke();
  const wv=(G.t%6)<2.4;
  otterFront(c,{x,y,s,t:G.t,pose:'wave',waveSpeed:wv?8:2,mood:(G.t%6)<2.4?'happy':'smile',blink:(G.t%4.3)<.13});
}
function drawEntities(c){
  for(const tr of G.trash) trashItem(c,tr.x,tr.y,1,tr.rot,tr.kind,G.t);
  for(const cr of G.crays) crayfish(c,cr.x,cr.y,.8,G.t+cr.ph);
  for(const h of G.hooks) hookDraw(c,h.x,surfY(h.x)-1,h.hy,G.t+h.ph);
  for(const f of G.fish) fish(c,f.x,f.y,f.s,G.t+f.ph,f.type,false);
  for(const p of G.pearls) factBubble(c,p.x,p.y,p.r,G.t+p.ph,String(G.found+1));
}
function drawParts(c){
  for(const p of G.parts){
    if(p.k==='bub'){ c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=1.6; circ(c,p.x,p.y,p.r); c.stroke(); c.fillStyle='rgba(255,255,255,.16)'; c.fill(); c.fillStyle='rgba(255,255,255,.9)'; circ(c,p.x-p.r*.35,p.y-p.r*.35,p.r*.28); c.fill(); }
    else if(p.k==='drop'){ c.fillStyle='rgba(228,249,255,.95)'; circ(c,p.x,p.y,p.r); c.fill(); }
    else if(p.k==='spark'){ c.globalAlpha=clamp(p.life/p.max*1.6,0,1); c.fillStyle=p.col; sparkle(c,p.x,p.y,p.r); c.fill(); c.globalAlpha=1; }
    else if(p.k==='ring'){ c.globalAlpha=p.life/p.max; c.strokeStyle='#fff'; c.lineWidth=2.5; ell(c,p.x,p.y,p.r,p.r*.22); c.stroke(); c.globalAlpha=1; }
    else if(p.k==='radar'){ c.globalAlpha=p.life/p.max*.85; c.strokeStyle='#8ff4ff'; c.lineWidth=4; c.lineCap='round'; c.beginPath(); c.arc(p.x,p.y,p.r,p.a-.75,p.a+.75); c.stroke(); c.globalAlpha=1; }
    else if(p.k==='speed'){ c.globalAlpha=.6*p.life/p.max; c.strokeStyle='#fff'; c.lineWidth=3; c.lineCap='round'; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x+p.len,p.y); c.stroke(); c.globalAlpha=1; }
  }
}
function render(){
  const c=ctx; if(!CW) return;
  c.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  if(G.shake>0&&!reduceMotion) c.translate(rnd(-1,1)*G.shake*10,rnd(-1,1)*G.shake*10);
  drawSky(c); drawWaterBack(c); drawBed(c); drawEntities(c);
  if(G.scene!=='game') drawTitleOtter(c);
  if(G.scene!=='title') drawPlayer(c);
  drawParts(c); drawFore(c); drawTint(c); drawSurface(c);
  if(G.scene!=='game'&&!G.title.hidden){ const s=G.wide?1.05:1.1; c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=3; c.beginPath(); c.ellipse(G.title.x,G.surf+3,96*s,11*s,0,0,Math.PI); c.stroke(); }
  for(const p of G.pops){ c.globalAlpha=clamp(p.life*2,0,1); inkText(c,p.txt,p.x,p.y,30,p.col); } c.globalAlpha=1;
}

// ================= fact illustrations (480x270 space) =================
function artWater(c,c1,c2,y0=0){ const g=c.createLinearGradient(0,y0,0,270); g.addColorStop(0,c1); g.addColorStop(1,c2); c.fillStyle=g; const top=y0<=0?-60:y0; c.fillRect(-60,top,600,340-top); }
function artRays(c,t,y0=0){ c.fillStyle='rgba(255,255,255,.12)'; for(let i=0;i<4;i++){ const x=60+i*120+Math.sin(t*.4+i)*20; c.beginPath(); c.moveTo(x-12,y0); c.lineTo(x+12,y0); c.lineTo(x+70,280); c.lineTo(x+10,280); c.closePath(); c.fill(); } }
function artBubbles(c,t,n,seed,y0=0,spd=1){ c.lineWidth=1.5; for(let i=0;i<n;i++){ const h1=hash(seed+i*3.3), h2=hash(seed+i*7.1), h3=hash(seed+i*1.9), span=300-y0, y=290-wrap(t*(18+h2*30)*spd+h3*span,span), x=h1*480+Math.sin(t*2+i)*5, r=1.5+h2*4.5; c.strokeStyle='rgba(255,255,255,.7)'; circ(c,x,y,r); c.stroke(); c.fillStyle='rgba(255,255,255,.15)'; c.fill(); } }

const FX=[]; let fxDirty=false;
function confetti(n){ const cols=['#ffc83d','#ff6a5a','#6fdcf0','#7be08f','#ffffff','#b48cff']; const m=reduceMotion?Math.round(n/4):n; for(let i=0;i<m;i++) FX.push({x:rnd(0,W),y:rnd(-260,-10),vx:rnd(-60,60),vy:rnd(90,260),r:rnd(0,TAU),vr:rnd(-8,8),w:rnd(9,15),h:rnd(5,9),col:pick(cols),life:rnd(3.5,5.5)}); }
function stepFx(dt){
  if(!FX.length){ if(fxDirty){ fx.setTransform(1,0,0,1,0,0); fx.clearRect(0,0,fxc.width,fxc.height); fxDirty=false; } return; }
  fx.setTransform(1,0,0,1,0,0); fx.clearRect(0,0,fxc.width,fxc.height); fx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  for(const p of FX){ p.vy+=50*dt; p.x+=(p.vx+Math.sin(p.life*4)*40)*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.life-=dt; fx.save(); fx.translate(p.x,p.y); fx.rotate(p.r); fx.scale(1,Math.cos(p.life*6)); fx.fillStyle=p.col; fx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fx.restore(); }
  for(let i=FX.length-1;i>=0;i--) if(FX[i].life<=0||FX[i].y>VH+30) FX.splice(i,1);
  fxDirty=true;
}

  if(!back){ confetti(180); Snd.play('win'); }
  setTimeout(()=>$('#btn-again').focus({preventScroll:true}),60);
}

// events
$('#btn-play').addEventListener('click',startDive);
$('#btn-book').addEventListener('click',()=>{ Snd.init(); Snd.play('click'); openFact(0,'book'); });
$('#btn-res-book').addEventListener('click',()=>{ Snd.play('click'); hide('#results'); openFact(0,'book'); });
$('#btn-start').addEventListener('click',()=>{ Snd.play('click'); beginPlay(); });
$('#fact-next').addEventListener('click',()=>{ Snd.play('click'); closeFact(); });
$('#fact-close').addEventListener('click',()=>{ Snd.play('click'); closeFact(); });
$('#book-prev').addEventListener('click',()=>bookGo(-1));
$('#book-next').addEventListener('click',()=>bookGo(1));
$('#book-dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; G.factIdx=+b.dataset.i; fillFact(); artT0=performance.now(); Snd.play('click'); });
$$('.listen-btn').forEach(b=>b.addEventListener('click',()=>{ if(speaking){ stopSpeech(); return; } const f=T().facts[G.factIdx]; speak(f[0]+'. '+f[1]); }));
$('#btn-pause').addEventListener('click',()=>{ Snd.play('click'); pause(); });
$('#btn-resume').addEventListener('click',()=>{ Snd.play('click'); resume(); });
$('#btn-restart').addEventListener('click',()=>{ Snd.play('click'); restart(); });
$('#btn-home').addEventListener('click',()=>{ Snd.play('click'); showTitle(); });
$('#btn-res-home').addEventListener('click',()=>{ Snd.play('click'); showTitle(); });
$('#btn-again').addEventListener('click',()=>{ Snd.play('click'); restart(); });
$('#btn-quiz').addEventListener('click',()=>{ Snd.play('click'); startQuiz(); });
$('#quiz-next').addEventListener('click',quizNext);
$('#btn-sound-title').addEventListener('click',toggleSound);
$('#btn-sound-pause').addEventListener('click',toggleSound);
$('#lang-en').addEventListener('click',()=>setLang('en'));
$('#lang-ru').addEventListener('click',()=>setLang('ru'));
const fsEl=document.documentElement;
if(document.fullscreenEnabled||document.webkitFullscreenEnabled){ $('#btn-fs').hidden=false; $('#btn-fs').addEventListener('click',()=>{ try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { const r=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl); if(r&&r.catch) r.catch(()=>{}); } }catch(e){} }); }

function setTarget(e){ const r=cv.getBoundingClientRect(); G.target.x=(e.clientX-r.left)/SC-70; G.target.y=(e.clientY-r.top)/SC; }
cv.addEventListener('pointerdown',e=>{ G.pointer=true; if(G.mode==='play'){ setTarget(e); if($('#hint').dataset.key==='drag') hideHint(); } try{cv.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(G.mode==='play'&&(G.pointer||e.pointerType==='mouse')) setTarget(e); });
const up=()=>{G.pointer=false;}; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
app.addEventListener('touchmove',e=>{ if(e.target===cv) e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('dblclick',e=>e.preventDefault());
addEventListener('keydown',e=>{ G.keys[e.key]=true; if(e.key==='Escape'||e.key==='p'){ if(G.mode==='play') pause(); else if(G.mode==='pause') resume(); } if(e.key.startsWith('Arrow')&&G.mode==='play') e.preventDefault(); if(G.mode==='book'){ if(e.key==='ArrowRight') bookGo(1); if(e.key==='ArrowLeft') bookGo(-1); } });
addEventListener('keyup',e=>{ G.keys[e.key]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G.mode==='play') pause(); stopSpeech(); if(Snd.ctx) try{Snd.ctx.suspend();}catch(e){} } else if(Snd.ctx){ try{Snd.ctx.resume();}catch(e){} } });
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

// ================= loop =================
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; dt=clamp(dt,0,.05);
  if(G.mode==='title') updateAmbient(dt,28); else if(G.mode==='dive') updateDive(dt); else if(G.mode==='play') updatePlay(dt);
  if(LIVE[G.mode]) render();
  if(G.mode==='fact'||G.mode==='book') drawArt(now);
  if(mascot.el) drawMascot(now);
  stepFx(dt);
}
function boot(data){
  if(data&&TXT[data.lang]) lang=data.lang;
  if(data&&typeof data.muted==='boolean') muted=data.muted;
  applyLang(); soundUI(); resize(); G.otter=newOtter(-170,520);
  for(let i=0;i<3;i++){ spawnSchool(); G.fish.slice(-5).forEach(f=>f.x-=rnd(200,900)); }
  requestAnimationFrame(t=>{ last=t; frame(t); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!LIVE[G.mode]) render(); });
}
try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({lang,muted})); }catch(e){}
const H=window.claude&&window.claude.hot;
if(H&&H.ready) H.ready(boot); else boot((H&&H.data)||{});
})();
</script>
