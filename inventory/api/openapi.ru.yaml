openapi: 3.0.3

info:
  title: Unit.Travel Hotel Partner Inventory API
  version: "1.8.0"
  description: >
    API интеграции инвенторной системы Unit.Travel с PMS и Channel Manager.

    Модель ARI (Availability, Rates, Inventory): партнёр (PMS/CM) ПУШИТ
    обновления наличия, цен и ограничений в Unit.Travel; Unit.Travel отдаёт
    бронирования обратно (pull через `/reservations` или push через webhook).

    Основные принципы:
      * Защита от повторов (Идемпотентность) — каждое ARI-сообщение имеет
        `message_uid`, уникальный в рамках подключения; повтор с тем же
        `message_uid` не применяется дважды, возвращается исходный результат.
      * Порядок / last-write-wins — у каждого элемента есть `revision`
        (монотонный счётчик/таймстамп источника); обновление применяется,
        только если `revision` не старше сохранённого.
      * Асинхронность — приём ARI отвечает `202 Accepted`; статус обработки
        опрашивается по `GET /ari/messages/{message_uid}`.
      * Коды — партнёр может ссылаться на номера/тарифы СВОИМИ кодами
        (`room_code` / `rate_plan_code`) и/или нашими id (`room_id` /
        `rate_plan_id`). Соответствие задаётся один раз через `/mappings`; и код,
        и id возвращаются в справочниках и бронированиях.
  contact:
    name: Unit.Travel Integrations
    email: dev@unit.travel

servers:
  - url: https://api.test.unit.travel/partner/v1
    description: Sandbox (тестовое окружение)
  - url: https://api.unit.travel/partner/v1
    description: Production

security:
  - apiKeyAuth: []

tags:
  - name: System
    description: Проверка доступности
  - name: Onboarding
    description: Подключения, каталог номеров/тарифов и маппинг кодов
  - name: ARI
    description: Приём наличия, цен и ограничений (партнёр → Unit.Travel)
  - name: Reservations
    description: Выдача бронирований (Unit.Travel → партнёр)

paths:

  /ping:
    get:
      tags: [System]
      summary: Health-check и проверка ключа
      responses:
        "200":
          description: Сервис доступен, ключ валиден
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  server_time: { type: string, format: date-time }
                  provider_id: { type: integer, example: 42 }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections:
    post:
      tags: [Onboarding]
      summary: Инициировать подключение отеля (PMS/CM → Unit.Travel)
      description: >
        Вызывается PMS/CM, когда отель вставляет свой `property_id` из
        Unit.Travel в раздел «Каналы/Интеграции» партнёра. Создаёт подключение
        в статусе `pending` и уведомляет отель ПОДТВЕРДИТЬ его в Extranet
        Unit.Travel. Справочники, маппинг и ARI закрыты, пока подключение не
        станет `active`. Авторизация — общим API-ключом провайдера. Идемпотентно
        по (провайдер, property_id): повтор возвращает существующее подключение.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        "201":
          description: Запрос на подключение создан (ждёт подтверждения отеля)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "200":
          description: Подключение уже существует — возвращается текущее состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Onboarding]
      summary: Список подключений провайдера (опц. по отелю/статусу)
      parameters:
        - name: property_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, rejected, disconnected] }
      responses:
        "200":
          description: Подключения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections/{connection_id}:
    get:
      tags: [Onboarding]
      summary: Статус подключения (опрашивать до active)
      description: >
        PMS/CM опрашивает до `status = active`. Либо подпишитесь на webhook
        `connection.*`, чтобы получить уведомление, когда отель подтвердит.
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Состояние подключения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Onboarding]
      summary: Отключить (прекратить синхронизацию отеля)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Отключено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /properties/{property_id}/rooms:
    get:
      tags: [Onboarding]
      summary: Каталог категорий номеров Unit.Travel (для маппинга)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/rate-plans:
    get:
      tags: [Onboarding]
      summary: Каталог тарифных планов Unit.Travel (для маппинга)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список тарифов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RatePlan' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/mappings:
    get:
      tags: [Onboarding]
      summary: Текущие соответствия внешних кодов партнёра нашим id
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список маппингов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mapping' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Onboarding]
      summary: Задать/обновить соответствия кодов (idempotent upsert)
      description: >
        Партнёр присылает соответствие СВОИХ кодов номеров/тарифов нашим
        `room_id` / `rate_plan_id`. Требуется до отправки ARI: элементы ARI с
        неизвестным кодом будут отклонены.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Mapping' }
      responses:
        "200":
          description: Маппинги сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /ari:
    post:
      tags: [ARI]
      summary: Приём ARI-обновления (наличие + цены + ограничения)
      description: >
        Единое batch-сообщение. Идемпотентно по `message_uid`. Отвечает
        `202 Accepted`; фактическое применение — асинхронно, статус через
        `GET /ari/messages/{message_uid}`.

        ОДИН отель — задайте `property_id` и любые из массивов `availability` /
        `rates` / `restrictions` (хотя бы один непустой). НЕСКОЛЬКО отелей —
        используйте `items[]`, где каждый элемент несёт свой `property_id` и
        массивы.

        Цены поддерживают две модели (см. `RateItem.pricing_model`): `per_room`
        (одна цена на связку room+rate) и `per_guest` (`occupancy_prices[]` —
        абсолютная цена для каждого количества гостей).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AriMessage' }
            examples:
              perRoom:
                $ref: '#/components/examples/AriPerRoom'
              perGuest:
                $ref: '#/components/examples/AriPerGuest'
              multiProperty:
                $ref: '#/components/examples/AriMultiProperty'
      responses:
        "202":
          description: Сообщение принято в обработку
          headers:
            Location:
              description: URL для опроса статуса
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriAccepted' }
        "200":
          description: >
            Повтор с уже виденным `message_uid` — возвращается прежний
            результат без повторного применения (идемпотентность).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Unprocessable' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /ari/messages/{message_uid}:
    get:
      tags: [ARI]
      summary: Статус обработки ARI-сообщения
      parameters:
        - name: message_uid
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /reservations:
    get:
      tags: [Reservations]
      summary: Выдача новых/изменённых/отменённых бронирований (pull)
      description: >
        Для PMS/CM, забирающих брони опросом. Постранично, по курсору.
        Альтернатива — webhook (см. README и `ReservationEvent`).

        Гости: в ответе всегда есть `primary_guest` (контакты + национальность).
        Отели, которым нужны имена ВСЕХ гостей, дополнительно получают
        необязательный массив `guests[]`, где каждый гость привязан к номеру
        через `room_index` (актуально для multi-room броней).
      parameters:
        - $ref: '#/components/parameters/PropertyId2'
        - name: since
          in: query
          description: Вернуть бронирования, изменённые с этого момента (ISO 8601)
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, modified, cancelled]
        - name: cursor
          in: query
          description: Курсор следующей страницы (из предыдущего ответа)
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Страница бронирований
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationList' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /reservations/{reservation_id}/acknowledge:
    post:
      tags: [Reservations]
      summary: Подтвердить приём брони партнёром
      description: >
        После успешной загрузки брони в PMS/CM подтвердите её, чтобы она не
        повторялась в pull-выдаче. Для webhook подтверждением служит `200`.
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Подтверждено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        ЕДИНЫЙ общий API-ключ выдаётся Unit.Travel на ПРОВАЙДЕРА (весь PMS/CM),
        а не на каждый отель. Передаётся заголовком `X-API-Key: <key>`. Каждый
        запрос по конкретному отелю несёт `property_id` и работает только когда
        подключение отеля в статусе `active` (см. `POST /connections`).
        Опционально — IP-allowlist. Проверка ключа — `GET /ping`.

  parameters:
    PropertyId:
      name: property_id
      in: path
      required: true
      description: Идентификатор объекта размещения в Unit.Travel
      schema: { type: integer, format: int64 }
    PropertyId2:
      name: property_id
      in: query
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Необязательный дубль `message_uid` из тела (если задан — должен
        совпадать). Обеспечивает защиту от повторов на уровне транспорта.
      schema: { type: string, maxLength: 120 }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: Идентификатор подключения из POST /connections
      schema: { type: string }

  responses:
    Unauthorized:
      description: Отсутствует или неверный API-ключ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Объект не найден (неизвестный id / вне области видимости провайдера)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Некорректный запрос (структура тела/параметров или валидация)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: >
        Семантическая ошибка: неизвестный код номера/тарифа, некорректный
        диапазон дат, устаревший `revision` и т.п.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Через сколько секунд повторить
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        Подключение отеля для этого property не активно
        (pending/rejected/disconnected). Справочники, маппинг и ARI доступны
        только для активного подключения (см. POST /connections).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: connection_not_active
        message:
          type: string
          example: "connection for property 123 is not active"
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: "rates[3].rate_plan_code" }
              reason: { type: string }

    Ack:
      type: object
      properties:
        status: { type: string, example: ok }

    Room:
      type: object
      description: Категория номера (единица инвентаря/наличия).
      properties:
        id: { type: integer, format: int64, example: 4500 }
        code: { type: string, example: "DLX" }
        name: { type: string, example: "Deluxe Room" }
        base_occupancy:
          type: integer
          description: Стандартное число гостей, которое покрывает базовая цена
          example: 2
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: >
            Как тарифицируется номер — `per_room` (не зависит от числа гостей)
            или `per_guest` (цена зависит от числа гостей). ARI-обновление цен
            должно соответствовать этой модели.
          example: per_room
        max_adults: { type: integer, example: 3 }
        max_children: { type: integer, example: 2 }
        max_infants: { type: integer, example: 1 }
        max_occupancy: { type: integer, example: 4 }

    RatePlan:
      type: object
      properties:
        id: { type: integer, format: int64, example: 13500 }
        code: { type: string, example: "STD-BB-FLEX" }
        name: { type: string, example: "Standard BB Flexible" }
        room_id: { type: integer, format: int64, example: 4500 }
        board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
        currency: { type: string, example: "EUR" }
        is_refundable: { type: boolean, example: true }
        is_private_rate:
          type: boolean
          description: Приватный/negotiated тариф (виден только по аккаунту/коду доступа)
          example: false
        is_package_rate:
          type: boolean
          description: Пакетный тариф (в связке с доп. услугами)
          example: false
        parent_rate_id:
          type: integer
          format: int64
          nullable: true
          description: Для производного (derive) тарифа — id родительского тарифа
          example: null

    Mapping:
      type: object
      required: [entity_type, external_code, internal_id]
      properties:
        entity_type:
          type: string
          enum: [room, rate_plan]
        external_code:
          type: string
          description: Код на стороне партнёра (PMS/CM)
          example: "SRV-ROOM-01"
        internal_id:
          type: integer
          format: int64
          description: id номера/тарифа в Unit.Travel (room_id / rate_plan_id)
          example: 4500

    AriMessage:
      type: object
      required: [message_uid]
      description: >
        Укажите ЛИБО верхнеуровневый `property_id` + массивы (один отель), ЛИБО
        `items[]` (несколько отелей). `message_uid` обязателен всегда.
      properties:
        message_uid:
          type: string
          maxLength: 120
          description: Уникальный id сообщения в рамках подключения (защита от повторов)
          example: "srv-2026-07-01T10:00:00-abc123"
        revision:
          type: integer
          format: int64
          description: >
            Монотонный счётчик/таймстамп источника для last-write-wins.
            Применяется, только если не старше сохранённого.
          example: 1719827400
        property_id:
          type: integer
          format: int64
          description: Сокращённая форма для одного отеля (не указывать при items[])
          example: 123
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }
        items:
          type: array
          description: Батч по нескольким отелям — каждый элемент обновляет один отель.
          items: { $ref: '#/components/schemas/AriPropertyBatch' }

    AriPropertyBatch:
      type: object
      required: [property_id]
      properties:
        property_id: { type: integer, format: int64, example: 123 }
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }

    AvailabilityItem:
      type: object
      required: [date_from, date_to, units]
      description: >
        Наличие («rooms to sell») на категорию номера. Идентифицируйте номер
        через `room_code` и/или `room_id` (хотя бы один). Хранится как
        аллотмент; фактическая доступность = units − наши подтверждённые брони.
      properties:
        room_code: { type: string, description: внешний код номера, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, description: id номера в Unit.Travel, example: 4500 }
        date_from: { type: string, format: date, example: "2026-07-01" }
        date_to:   { type: string, format: date, description: включительно, example: "2026-07-31" }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        units:
          type: integer
          minimum: 0
          description: Число номеров к продаже
          example: 5
        closed:
          type: boolean
          description: Полный stop-sell на категорию (перекрывает units)
          default: false

    RateItem:
      type: object
      required: [date_from, date_to, currency]
      description: >
        Цена на связку room + rate. Идентифицируйте связку кодами
        (`room_code` + `rate_plan_code`) и/или нашими id (`room_id` +
        `rate_plan_id`); тариф обязателен, а `room_*` привязывает цену к
        конкретному номеру (цены обычно ставятся на связку room+rate). Нетто,
        без налогов/сборов. Две модели:
          * per_room  — одна `price` за ночь (не зависит от числа гостей);
          * per_guest — `occupancy_prices[]`: абсолютная цена за ночь для
            каждого числа гостей.
        Детские цены задаются отдельно (Child rates), в ARI не передаются.
      properties:
        room_code: { type: string, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, example: 4500 }
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: включительно }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: Должна совпадать с pricing_model номера.
          example: per_room
        price:
          type: number
          format: double
          description: "Модель per_room: цена за ночь на связку room+rate"
          example: 120.00
        occupancy_prices:
          type: array
          description: "Модель per_guest: абсолютная цена за ночь для каждого числа гостей"
          items:
            type: object
            required: [occupancy, price]
            properties:
              occupancy: { type: integer, description: число гостей (взрослых), example: 2 }
              price: { type: number, format: double, example: 120.00 }
        currency: { type: string, example: "EUR" }

    RestrictionItem:
      type: object
      required: [date_from, date_to]
      description: >
        Ограничения тарифа. Идентифицируйте его через `rate_plan_code` и/или
        `rate_plan_id` (хотя бы один).
      properties:
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: включительно }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        min_stay: { type: integer, minimum: 1, example: 2 }
        max_stay: { type: integer, description: "0 = без ограничения", example: 0 }
        closed_to_arrival:   { type: boolean, default: false }
        closed_to_departure: { type: boolean, default: false }
        stop_sell:           { type: boolean, default: false }
        min_advance_days:    { type: integer, minimum: 0, example: 0 }
        max_advance_days:    { type: integer, minimum: 0, description: "0 = нет", example: 0 }
        release_days:        { type: integer, minimum: 0, example: 0 }

    DaysOfWeek:
      type: array
      description: >
        Дни недели, на которые действует элемент. Если не задано — все дни.
      items:
        type: string
        enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
      example: [MON, TUE, WED, THU, FRI]

    AriAccepted:
      type: object
      properties:
        message_uid: { type: string }
        status: { type: string, enum: [received], example: received }
        received_at: { type: string, format: date-time }

    AriMessageStatus:
      type: object
      properties:
        message_uid: { type: string }
        status:
          type: string
          enum: [received, processing, applied, failed, skipped]
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        applied_items: { type: integer, example: 62 }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Error' }

    ReservationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы; null — данных больше нет

    Reservation:
      type: object
      description: >
        Бронирование, отдаваемое партнёру. Номер/тариф указаны и нашими id
        (`room_id`/`rate_plan_id`), и кодами партнёра (`room_code`/
        `rate_plan_code`). `primary_guest` всегда несёт контакты; необязательный
        `guests[]` перечисляет всех гостей с привязкой к номерам, если отель
        этого требует.
      properties:
        reservation_id: { type: string, example: "UT-9F3A21" }
        property_id: { type: integer, format: int64, example: 123 }
        status:
          type: string
          enum: [new, modified, cancelled]
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        checkin: { type: string, format: date }
        checkout: { type: string, format: date }
        currency: { type: string, example: "EUR" }
        total_price: { type: number, format: double, example: 675.00 }
        rate_type:
          type: string
          enum: [gross, net]
          description: >
            gross — цена включает комиссию (см. `commission`); net — уже нетто,
            без комиссии.
          example: net
        commission:
          type: string
          description: >
            Размер комиссии в свободном тексте для GROSS-цен (напр. "15%" или
            "101.25 EUR"); для net не указывается/игнорируется.
          example: null
        channel: { type: string, example: "web" }
        special_request:
          type: string
          description: Пожелание гостя в свободном тексте (best effort, не гарантируется)
          example: "Поздний заезд ~23:00, по возможности высокий этаж"
        rooms:
          type: array
          items:
            type: object
            properties:
              room_code: { type: string, description: код партнёра (после маппинга), example: "SRV-ROOM-01" }
              room_id: { type: integer, format: int64, example: 4500 }
              rate_plan_code: { type: string, example: "STD-BB-FLEX" }
              rate_plan_id: { type: integer, format: int64, example: 13500 }
              board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
              is_refundable: { type: boolean, example: true }
              cancellation_policy:
                type: string
                description: Условия аннуляции в свободном тексте (нон-реф, если не возвратный)
                example: "Бесплатная отмена до 2026-07-08 18:00; далее штраф 1 ночь"
              occupancy:
                type: object
                properties:
                  adults: { type: integer, example: 2 }
                  children_ages:
                    type: array
                    items: { type: integer }
                    example: [6, 8]
                  infants: { type: integer, example: 0 }
              price: { type: number, format: double, example: 675.00 }
        primary_guest:
          type: object
          description: Главный гость — всегда присутствует, несёт контакты.
          required: [last_name]
          properties:
            first_name: { type: string, example: "Ivan" }
            last_name: { type: string, example: "Petrenko" }
            email: { type: string, format: email, example: "ivan@example.com" }
            phone: { type: string, example: "+380671234567" }
            nationality: { type: string, description: ISO 3166-1 alpha-2, example: "UA" }
        guests:
          type: array
          description: >
            Необязательный полный список гостей (некоторые отели требуют имена
            всех гостей). Каждый гость привязан к номеру через `room_index`
            (0-based индекс в `rooms[]`). Опускается, если нужен только главный.
          items:
            type: object
            properties:
              first_name: { type: string }
              last_name: { type: string }
              type: { type: string, enum: [adult, child], example: adult }
              room_index: { type: integer, description: "индекс в rooms[]", example: 0 }
        payment:
          type: object
          description: >
            Необязательные данные оплаты / гарантии. `method` — КАК произведена
            (будет произведена) оплата. Данные карты — PCI-чувствительны; шлите
            только по согласованному защищённому каналу, обычно
            токенизированные/маскированные.
          properties:
            type:
              type: string
              enum: [guarantee, prepaid, deposit, pay_at_hotel]
              example: guarantee
            method:
              type: string
              description: Как производится/произведена оплата
              example: "виртуальная карта"
            card:
              type: object
              description: Необязательная карта для гарантии/оплаты (PCI-чувствительно)
              properties:
                holder: { type: string, example: "IVAN PETRENKO" }
                number: { type: string, description: PAN или токен/маска, example: "411111******1111" }
                expiry_month: { type: integer, example: 11 }
                expiry_year: { type: integer, example: 2027 }
                cvc: { type: string, example: "***" }
                brand: { type: string, example: "VISA" }

    ConnectionRequest:
      type: object
      required: [property_id]
      properties:
        property_id:
          type: integer
          format: int64
          description: property_id из Extranet Unit.Travel, скопированный отелем
          example: 123
        external_property_code:
          type: string
          description: Код объекта на стороне партнёра (PMS/CM)
          example: "SRV-HOTEL-777"
        note:
          type: string
          description: Необязательная заметка, показываемая отелю при подтверждении

    Connection:
      type: object
      properties:
        connection_id: { type: string, example: "conn_01HQ4Z9..." }
        property_id: { type: integer, format: int64, example: 123 }
        external_property_code: { type: string, nullable: true, example: "SRV-HOTEL-777" }
        status:
          type: string
          enum: [pending, active, rejected, disconnected]
          description: >
            pending — ждёт подтверждения отеля в Extranet; active —
            подтверждено, справочники/маппинг/ARI открыты; rejected — отель
            отклонил; disconnected — подключение завершено.
        scope:
          type: object
          description: Что разрешено этому подключению (задаётся на стороне Unit.Travel)
          properties:
            rates: { type: boolean, example: true }
            availability: { type: boolean, example: true }
            restrictions: { type: boolean, example: true }
        requested_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }

    ConnectionEvent:
      type: object
      description: >
        Webhook (Unit.Travel → endpoint партнёра) при изменении отелем статуса
        подключения в Extranet. Подписывается `X-UnitTravel-Signature`
        (HMAC-SHA256). На `connection.activated` PMS/CM может начинать синхро.
      properties:
        event:
          type: string
          enum: [connection.activated, connection.rejected, connection.disconnected]
        occurred_at: { type: string, format: date-time }
        connection: { $ref: '#/components/schemas/Connection' }

    ReservationEvent:
      type: object
      description: >
        Тело webhook-уведомления (Unit.Travel → endpoint партнёра).
        Подписывается заголовком `X-UnitTravel-Signature` (HMAC-SHA256).
      properties:
        event:
          type: string
          enum: [reservation.created, reservation.modified, reservation.cancelled]
        occurred_at: { type: string, format: date-time }
        reservation: { $ref: '#/components/schemas/Reservation' }

  examples:
    AriPerRoom:
      summary: Один отель, цена ЗА НОМЕР (per_room)
      value:
        message_uid: "ari-2026-07-01T10:00:00Z-000187"
        revision: 1719827400
        property_id: 123
        availability:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            units: 5
        rates:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_room
            price: 120.00
            currency: "EUR"
        restrictions:
          - rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-14"
            min_stay: 2
            closed_to_arrival: true
    AriPerGuest:
      summary: Один отель, цена ЗА ГОСТЕЙ (occupancy prices)
      value:
        message_uid: "ari-2026-07-01T10:05:00Z-000188"
        revision: 1719827700
        property_id: 123
        rates:
          - room_code: "SRV-ROOM-02"
            room_id: 4501
            rate_plan_code: "STD-RO-FLEX"
            rate_plan_id: 13510
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_guest
            occupancy_prices:
              - { occupancy: 1, price: 80.00 }
              - { occupancy: 2, price: 120.00 }
              - { occupancy: 3, price: 150.00 }
            currency: "EUR"
    AriMultiProperty:
      summary: Несколько отелей в одном сообщении (items[])
      value:
        message_uid: "ari-2026-07-01T10:10:00Z-000190"
        revision: 1719828000
        items:
          - property_id: 123
            availability:
              - { room_id: 4500, date_from: "2026-07-01", date_to: "2026-07-31", units: 5 }
          - property_id: 456
            rates:
              - room_id: 8800
                rate_plan_id: 22000
                date_from: "2026-07-01"
                date_to: "2026-07-31"
                pricing_model: per_room
                price: 99.00
                currency: "EUR"
