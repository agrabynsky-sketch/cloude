openapi: 3.0.3

info:
  title: Unit.Travel Hotel Partner Inventory API
  version: "1.8.0"
  description: >
    Integration API of the Unit.Travel inventory system for PMS and Channel
    Manager systems.

    ARI model (Availability, Rates, Inventory): the partner (PMS/CM) PUSHES
    availability, rates and restriction updates to Unit.Travel; Unit.Travel
    returns reservations back (pull via `/reservations` or push via webhook).

    Core principles:
      * Replay protection (Idempotency) — every ARI message carries a
        `message_uid` unique within the connection; resending the same
        `message_uid` is not applied twice, the original result is returned.
      * Ordering / last-write-wins — each element carries a `revision`
        (source-side monotonic counter/timestamp); an update is applied only
        if its `revision` is not older than the stored one.
      * Asynchronous — the ARI intake replies `202 Accepted`; processing status
        is polled via `GET /ari/messages/{message_uid}`.
      * Codes — the partner may reference rooms/rates by ITS OWN codes
        (`room_code` / `rate_plan_code`) and/or by our ids (`room_id` /
        `rate_plan_id`). The correspondence is set once via `/mappings`; both
        the code and the id are returned in catalogs and reservations.
  contact:
    name: Unit.Travel Integrations
    email: dev@unit.travel

servers:
  - url: https://api.test.unit.travel/partner/v1
    description: Sandbox (test environment)
  - url: https://api.unit.travel/partner/v1
    description: Production

security:
  - apiKeyAuth: []

tags:
  - name: System
    description: Availability check
  - name: Onboarding
    description: Connections, room/rate catalog and code mapping
  - name: ARI
    description: Availability, rates and restrictions intake (partner → Unit.Travel)
  - name: Reservations
    description: Reservation delivery (Unit.Travel → partner)

paths:

  /ping:
    get:
      tags: [System]
      summary: Health-check and key validation
      responses:
        "200":
          description: Service is up, key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  server_time: { type: string, format: date-time }
                  provider_id: { type: integer, example: 42 }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections:
    post:
      tags: [Onboarding]
      summary: Initiate a hotel connection (PMS/CM → Unit.Travel)
      description: >
        Called by the PMS/CM when a hotel pastes its Unit.Travel `property_id`
        into the partner's Channels/Integrations screen. Creates a connection in
        `pending` state and notifies the hotel to CONFIRM it in the Unit.Travel
        Extranet. Catalogs, mappings and ARI stay closed until the connection is
        `active`. Authenticated with the provider's shared API key. Idempotent by
        (provider, property_id): a repeated call returns the existing connection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        "201":
          description: Connection request created (pending hotel confirmation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "200":
          description: Connection already exists — current state returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Onboarding]
      summary: List this provider's connections (optionally by property/status)
      parameters:
        - name: property_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, rejected, disconnected] }
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections/{connection_id}:
    get:
      tags: [Onboarding]
      summary: Connection status (poll until active)
      description: >
        The PMS/CM polls this until `status = active`. Alternatively, subscribe
        to the `connection.*` webhook to be notified when the hotel confirms.
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Onboarding]
      summary: Disconnect (stop syncing this property)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /properties/{property_id}/rooms:
    get:
      tags: [Onboarding]
      summary: Unit.Travel room categories catalog (for mapping)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: List of room categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/rate-plans:
    get:
      tags: [Onboarding]
      summary: Unit.Travel rate plans catalog (for mapping)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: List of rate plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RatePlan' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/mappings:
    get:
      tags: [Onboarding]
      summary: Current mapping of partner external codes to our ids
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: List of mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mapping' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Onboarding]
      summary: Set/update code mappings (idempotent upsert)
      description: >
        The partner submits the correspondence of ITS room/rate codes to our
        `room_id` / `rate_plan_id`. Required before sending ARI: ARI elements
        with an unknown code will be rejected.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Mapping' }
      responses:
        "200":
          description: Mappings saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /ari:
    post:
      tags: [ARI]
      summary: ARI update intake (availability + rates + restrictions)
      description: >
        Single batch message. Idempotent by `message_uid`. Replies
        `202 Accepted`; the actual apply is asynchronous, poll status via
        `GET /ari/messages/{message_uid}`.

        ONE property — set `property_id` and any of the `availability` /
        `rates` / `restrictions` arrays (at least one non-empty). MANY
        properties — use `items[]`, each element carrying its own `property_id`
        and arrays.

        Rates support two pricing models (see `RateItem.pricing_model`):
        `per_room` (one price per room+rate) and `per_guest`
        (`occupancy_prices[]` — absolute price for each number of guests).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AriMessage' }
            examples:
              perRoom:
                $ref: '#/components/examples/AriPerRoom'
              perGuest:
                $ref: '#/components/examples/AriPerGuest'
              multiProperty:
                $ref: '#/components/examples/AriMultiProperty'
      responses:
        "202":
          description: Message accepted for processing
          headers:
            Location:
              description: URL to poll the status
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriAccepted' }
        "200":
          description: >
            Replay with an already-seen `message_uid` — the previous result is
            returned without re-applying (idempotency).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Unprocessable' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /ari/messages/{message_uid}:
    get:
      tags: [ARI]
      summary: ARI message processing status
      parameters:
        - name: message_uid
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /reservations:
    get:
      tags: [Reservations]
      summary: Deliver new/modified/cancelled reservations (pull)
      description: >
        For PMS/CM that fetch reservations by polling. Paginated by cursor.
        Alternative — webhook (see README and `ReservationEvent`).

        Guests: the response always carries a `primary_guest` (contacts +
        nationality). Hotels that require the names of ALL guests can also
        receive the optional `guests[]` array, where each guest is bound to a
        room via `room_index` (relevant for multi-room bookings).
      parameters:
        - $ref: '#/components/parameters/PropertyId2'
        - name: since
          in: query
          description: Return reservations changed since this moment (ISO 8601)
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, modified, cancelled]
        - name: cursor
          in: query
          description: Next-page cursor (from the previous response)
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: A page of reservations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationList' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /reservations/{reservation_id}/acknowledge:
    post:
      tags: [Reservations]
      summary: Acknowledge reservation receipt by the partner
      description: >
        After the reservation is loaded into the PMS/CM, acknowledge it so it
        is not repeated in the pull feed. For webhooks a `200` reply is the
        acknowledgement.
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        A SINGLE shared API key is issued by Unit.Travel PER PROVIDER (the
        whole PMS/CM), not per hotel. Sent via the `X-API-Key: <key>` header.
        Every property-scoped call carries its `property_id` and works only
        once the hotel's connection is `active` (see `POST /connections`).
        Optionally — IP allowlist. Validate the key with `GET /ping`.

  parameters:
    PropertyId:
      name: property_id
      in: path
      required: true
      description: Property identifier in Unit.Travel
      schema: { type: integer, format: int64 }
    PropertyId2:
      name: property_id
      in: query
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional duplicate of the body `message_uid` (if set, must match).
        Provides replay protection at the transport level.
      schema: { type: string, maxLength: 120 }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: Connection identifier returned by POST /connections
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Object not found (unknown id / not in this provider's scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request (body/query structure or validation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: >
        Semantic error: unknown room/rate code, invalid date range, stale
        `revision`, etc.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        The hotel's connection for this property is not active
        (pending/rejected/disconnected). Catalogs, mappings and ARI are
        available only for an active connection (see POST /connections).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: connection_not_active
        message:
          type: string
          example: "connection for property 123 is not active"
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: "rates[3].rate_plan_code" }
              reason: { type: string }

    Ack:
      type: object
      properties:
        status: { type: string, example: ok }

    Room:
      type: object
      description: Room category (unit of inventory/availability).
      properties:
        id: { type: integer, format: int64, example: 4500 }
        code: { type: string, example: "DLX" }
        name: { type: string, example: "Deluxe Room" }
        base_occupancy:
          type: integer
          description: Standard number of guests the base price covers
          example: 2
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: >
            How this room is priced — `per_room` (occupancy-independent) or
            `per_guest` (price depends on the number of guests). ARI rate
            updates must match this model.
          example: per_room
        max_adults: { type: integer, example: 3 }
        max_children: { type: integer, example: 2 }
        max_infants: { type: integer, example: 1 }
        max_occupancy: { type: integer, example: 4 }

    RatePlan:
      type: object
      properties:
        id: { type: integer, format: int64, example: 13500 }
        code: { type: string, example: "STD-BB-FLEX" }
        name: { type: string, example: "Standard BB Flexible" }
        room_id: { type: integer, format: int64, example: 4500 }
        board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
        currency: { type: string, example: "EUR" }
        is_refundable: { type: boolean, example: true }
        is_private_rate:
          type: boolean
          description: Private/negotiated rate (visible only to entitled accounts/codes)
          example: false
        is_package_rate:
          type: boolean
          description: Package rate (bundled with extras/services)
          example: false
        parent_rate_id:
          type: integer
          format: int64
          nullable: true
          description: For a derived rate — the id of the parent rate it inherits from
          example: null

    Mapping:
      type: object
      required: [entity_type, external_code, internal_id]
      properties:
        entity_type:
          type: string
          enum: [room, rate_plan]
        external_code:
          type: string
          description: Code on the partner (PMS/CM) side
          example: "SRV-ROOM-01"
        internal_id:
          type: integer
          format: int64
          description: Room/rate id in Unit.Travel (room_id / rate_plan_id)
          example: 4500

    AriMessage:
      type: object
      required: [message_uid]
      description: >
        Provide EITHER top-level `property_id` + arrays (single property) OR
        `items[]` (many properties). `message_uid` is always required.
      properties:
        message_uid:
          type: string
          maxLength: 120
          description: Message id unique within the connection (replay protection)
          example: "srv-2026-07-01T10:00:00-abc123"
        revision:
          type: integer
          format: int64
          description: >
            Source-side monotonic counter/timestamp for last-write-wins.
            Applied only if not older than the stored one.
          example: 1719827400
        property_id:
          type: integer
          format: int64
          description: Single-property shorthand (omit when using items[])
          example: 123
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }
        items:
          type: array
          description: Multi-property batch — each element updates one property.
          items: { $ref: '#/components/schemas/AriPropertyBatch' }

    AriPropertyBatch:
      type: object
      required: [property_id]
      properties:
        property_id: { type: integer, format: int64, example: 123 }
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }

    AvailabilityItem:
      type: object
      required: [date_from, date_to, units]
      description: >
        Availability ("rooms to sell") for a room category. Identify the room by
        `room_code` and/or `room_id` (at least one). Stored as an allotment;
        effective availability = units − our confirmed bookings.
      properties:
        room_code: { type: string, description: external room code, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, description: Unit.Travel room id, example: 4500 }
        date_from: { type: string, format: date, example: "2026-07-01" }
        date_to:   { type: string, format: date, description: inclusive, example: "2026-07-31" }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        units:
          type: integer
          minimum: 0
          description: Number of rooms to sell
          example: 5
        closed:
          type: boolean
          description: Full stop-sell for the category (overrides units)
          default: false

    RateItem:
      type: object
      required: [date_from, date_to, currency]
      description: >
        Price for a room + rate pair. Identify the pair by codes
        (`room_code` + `rate_plan_code`) and/or by our ids (`room_id` +
        `rate_plan_id`); the rate is mandatory, and `room_*` binds the price to
        a specific room (prices are normally set per room+rate). Net, excluding
        taxes/fees. Two pricing models:
          * per_room  — one `price` per night (occupancy-independent);
          * per_guest — `occupancy_prices[]`: absolute price per night for each
            number of guests.
        Child prices are configured separately (Child rates), not over ARI.
      properties:
        room_code: { type: string, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, example: 4500 }
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: inclusive }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: Must match the room's pricing_model.
          example: per_room
        price:
          type: number
          format: double
          description: "per_room model: price per night for the room+rate"
          example: 120.00
        occupancy_prices:
          type: array
          description: "per_guest model: absolute price per night for each guest count"
          items:
            type: object
            required: [occupancy, price]
            properties:
              occupancy: { type: integer, description: number of guests (adults), example: 2 }
              price: { type: number, format: double, example: 120.00 }
        currency: { type: string, example: "EUR" }

    RestrictionItem:
      type: object
      required: [date_from, date_to]
      description: >
        Restrictions for a rate. Identify it by `rate_plan_code` and/or
        `rate_plan_id` (at least one).
      properties:
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: inclusive }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        min_stay: { type: integer, minimum: 1, example: 2 }
        max_stay: { type: integer, description: "0 = no limit", example: 0 }
        closed_to_arrival:   { type: boolean, default: false }
        closed_to_departure: { type: boolean, default: false }
        stop_sell:           { type: boolean, default: false }
        min_advance_days:    { type: integer, minimum: 0, example: 0 }
        max_advance_days:    { type: integer, minimum: 0, description: "0 = none", example: 0 }
        release_days:        { type: integer, minimum: 0, example: 0 }

    DaysOfWeek:
      type: array
      description: >
        Days of week the element applies to. If omitted — all days.
      items:
        type: string
        enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
      example: [MON, TUE, WED, THU, FRI]

    AriAccepted:
      type: object
      properties:
        message_uid: { type: string }
        status: { type: string, enum: [received], example: received }
        received_at: { type: string, format: date-time }

    AriMessageStatus:
      type: object
      properties:
        message_uid: { type: string }
        status:
          type: string
          enum: [received, processing, applied, failed, skipped]
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        applied_items: { type: integer, example: 62 }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Error' }

    ReservationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
        next_cursor:
          type: string
          nullable: true
          description: Next-page cursor; null — no more data

    Reservation:
      type: object
      description: >
        A booking delivered to the partner. Room/rate are given both as our ids
        (`room_id`/`rate_plan_id`) and the partner codes (`room_code`/
        `rate_plan_code`). `primary_guest` always carries contacts; the optional
        `guests[]` lists all guests bound to rooms when the hotel requires it.
      properties:
        reservation_id: { type: string, example: "UT-9F3A21" }
        property_id: { type: integer, format: int64, example: 123 }
        status:
          type: string
          enum: [new, modified, cancelled]
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        checkin: { type: string, format: date }
        checkout: { type: string, format: date }
        currency: { type: string, example: "EUR" }
        total_price: { type: number, format: double, example: 675.00 }
        rate_type:
          type: string
          enum: [gross, net]
          description: >
            gross — price includes commission (see `commission`); net — already
            net of commission.
          example: net
        commission:
          type: string
          description: >
            Commission size in free text for GROSS rates (e.g. "15%" or
            "101.25 EUR"); omitted/ignored for net rates.
          example: null
        channel: { type: string, example: "web" }
        special_request:
          type: string
          description: Free-text guest request (best effort, not guaranteed)
          example: "Late arrival ~23:00, high floor if possible"
        rooms:
          type: array
          items:
            type: object
            properties:
              room_code: { type: string, description: partner code (after mapping), example: "SRV-ROOM-01" }
              room_id: { type: integer, format: int64, example: 4500 }
              rate_plan_code: { type: string, example: "STD-BB-FLEX" }
              rate_plan_id: { type: integer, format: int64, example: 13500 }
              board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
              is_refundable: { type: boolean, example: true }
              cancellation_policy:
                type: string
                description: Cancellation terms in free text (non-refundable if not refundable)
                example: "Free cancellation until 2026-07-08 18:00; then 1 night penalty"
              occupancy:
                type: object
                properties:
                  adults: { type: integer, example: 2 }
                  children_ages:
                    type: array
                    items: { type: integer }
                    example: [6, 8]
                  infants: { type: integer, example: 0 }
              price: { type: number, format: double, example: 675.00 }
        primary_guest:
          type: object
          description: Lead guest — always present, carries the contacts.
          required: [last_name]
          properties:
            first_name: { type: string, example: "Ivan" }
            last_name: { type: string, example: "Petrenko" }
            email: { type: string, format: email, example: "ivan@example.com" }
            phone: { type: string, example: "+380671234567" }
            nationality: { type: string, description: ISO 3166-1 alpha-2, example: "UA" }
        guests:
          type: array
          description: >
            Optional full guest list (some hotels require every guest's name).
            Each guest is bound to a room via `room_index` (0-based into
            `rooms[]`). Omitted when only the lead guest is needed.
          items:
            type: object
            properties:
              first_name: { type: string }
              last_name: { type: string }
              type: { type: string, enum: [adult, child], example: adult }
              room_index: { type: integer, description: "index into rooms[]", example: 0 }
        payment:
          type: object
          description: >
            Optional payment / guarantee details. `method` says HOW payment
            was/will be made. Card data is PCI-sensitive — send only over the
            agreed secure channel; usually tokenized/masked.
          properties:
            type:
              type: string
              enum: [guarantee, prepaid, deposit, pay_at_hotel]
              example: guarantee
            method:
              type: string
              description: How payment is/was made
              example: "virtual credit card"
            card:
              type: object
              description: Optional card for guarantee/payment (PCI-sensitive)
              properties:
                holder: { type: string, example: "IVAN PETRENKO" }
                number: { type: string, description: PAN or token/masked, example: "411111******1111" }
                expiry_month: { type: integer, example: 11 }
                expiry_year: { type: integer, example: 2027 }
                cvc: { type: string, example: "***" }
                brand: { type: string, example: "VISA" }

    ConnectionRequest:
      type: object
      required: [property_id]
      properties:
        property_id:
          type: integer
          format: int64
          description: Unit.Travel property id the hotel copied from the Extranet
          example: 123
        external_property_code:
          type: string
          description: The property's code on the partner (PMS/CM) side
          example: "SRV-HOTEL-777"
        note:
          type: string
          description: Optional free-text note shown to the hotel on confirmation

    Connection:
      type: object
      properties:
        connection_id: { type: string, example: "conn_01HQ4Z9..." }
        property_id: { type: integer, format: int64, example: 123 }
        external_property_code: { type: string, nullable: true, example: "SRV-HOTEL-777" }
        status:
          type: string
          enum: [pending, active, rejected, disconnected]
          description: >
            pending — awaiting hotel confirmation in the Extranet; active —
            confirmed, catalogs/mappings/ARI open; rejected — hotel declined;
            disconnected — connection ended.
        scope:
          type: object
          description: What this connection may manage (set on the Unit.Travel side)
          properties:
            rates: { type: boolean, example: true }
            availability: { type: boolean, example: true }
            restrictions: { type: boolean, example: true }
        requested_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }

    ConnectionEvent:
      type: object
      description: >
        Webhook (Unit.Travel → partner endpoint) sent when the hotel changes the
        connection state in the Extranet. Signed with `X-UnitTravel-Signature`
        (HMAC-SHA256). On `connection.activated` the PMS/CM may start syncing.
      properties:
        event:
          type: string
          enum: [connection.activated, connection.rejected, connection.disconnected]
        occurred_at: { type: string, format: date-time }
        connection: { $ref: '#/components/schemas/Connection' }

    ReservationEvent:
      type: object
      description: >
        Webhook notification body (Unit.Travel → partner endpoint). Signed with
        the `X-UnitTravel-Signature` header (HMAC-SHA256).
      properties:
        event:
          type: string
          enum: [reservation.created, reservation.modified, reservation.cancelled]
        occurred_at: { type: string, format: date-time }
        reservation: { $ref: '#/components/schemas/Reservation' }

  examples:
    AriPerRoom:
      summary: Single property, price PER ROOM
      value:
        message_uid: "ari-2026-07-01T10:00:00Z-000187"
        revision: 1719827400
        property_id: 123
        availability:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            units: 5
        rates:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_room
            price: 120.00
            currency: "EUR"
        restrictions:
          - rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-14"
            min_stay: 2
            closed_to_arrival: true
    AriPerGuest:
      summary: Single property, price PER GUEST (occupancy prices)
      value:
        message_uid: "ari-2026-07-01T10:05:00Z-000188"
        revision: 1719827700
        property_id: 123
        rates:
          - room_code: "SRV-ROOM-02"
            room_id: 4501
            rate_plan_code: "STD-RO-FLEX"
            rate_plan_id: 13510
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_guest
            occupancy_prices:
              - { occupancy: 1, price: 80.00 }
              - { occupancy: 2, price: 120.00 }
              - { occupancy: 3, price: 150.00 }
            currency: "EUR"
    AriMultiProperty:
      summary: Many properties in one message (items[])
      value:
        message_uid: "ari-2026-07-01T10:10:00Z-000190"
        revision: 1719828000
        items:
          - property_id: 123
            availability:
              - { room_id: 4500, date_from: "2026-07-01", date_to: "2026-07-31", units: 5 }
          - property_id: 456
            rates:
              - room_id: 8800
                rate_plan_id: 22000
                date_from: "2026-07-01"
                date_to: "2026-07-31"
                pricing_model: per_room
                price: 99.00
                currency: "EUR"
