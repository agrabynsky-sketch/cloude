openapi: 3.0.3

info:
  title: Unit.Travel Hotel Partner Inventory API
  version: "1.8.0"
  description: >
    API інтеграції інвенторної системи Unit.Travel з PMS та Channel Manager.

    Модель ARI (Availability, Rates, Inventory): партнер (PMS/CM) НАДСИЛАЄ
    оновлення наявності, цін та обмежень до Unit.Travel; Unit.Travel повертає
    бронювання назад (pull через `/reservations` або push через webhook).

    Основні принципи:
      * Захист від повторів (Ідемпотентність) — кожне ARI-повідомлення має
        `message_uid`, унікальний у межах підключення; повтор з тим самим
        `message_uid` не застосовується двічі, повертається початковий результат.
      * Порядок / last-write-wins — кожен елемент має `revision` (монотонний
        лічильник/мітка часу джерела); оновлення застосовується лише якщо
        `revision` не старіший за збережений.
      * Асинхронність — приймання ARI відповідає `202 Accepted`; статус обробки
        опитується через `GET /ari/messages/{message_uid}`.
      * Коди — партнер може посилатися на номери/тарифи СВОЇМИ кодами
        (`room_code` / `rate_plan_code`) та/або нашими id (`room_id` /
        `rate_plan_id`). Відповідність задається один раз через `/mappings`; і
        код, і id повертаються у довідниках та бронюваннях.
  contact:
    name: Unit.Travel Integrations
    email: dev@unit.travel

servers:
  - url: https://api.test.unit.travel/partner/v1
    description: Sandbox (тестове середовище)
  - url: https://api.unit.travel/partner/v1
    description: Production

security:
  - apiKeyAuth: []

tags:
  - name: System
    description: Перевірка доступності
  - name: Onboarding
    description: Підключення, каталог номерів/тарифів та маппінг кодів
  - name: ARI
    description: Приймання наявності, цін та обмежень (партнер → Unit.Travel)
  - name: Reservations
    description: Видача бронювань (Unit.Travel → партнер)

paths:

  /ping:
    get:
      tags: [System]
      summary: Health-check та перевірка ключа
      responses:
        "200":
          description: Сервіс доступний, ключ дійсний
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  server_time: { type: string, format: date-time }
                  provider_id: { type: integer, example: 42 }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections:
    post:
      tags: [Onboarding]
      summary: Ініціювати підключення готелю (PMS/CM → Unit.Travel)
      description: >
        Викликається PMS/CM, коли готель вставляє свій `property_id` з
        Unit.Travel у розділ «Канали/Інтеграції» партнера. Створює підключення
        у статусі `pending` і повідомляє готель ПІДТВЕРДИТИ його в Extranet
        Unit.Travel. Довідники, маппінг та ARI закриті, доки підключення не
        стане `active`. Авторизація — спільним API-ключем провайдера.
        Ідемпотентно за (провайдер, property_id): повтор повертає наявне.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        "201":
          description: Запит на підключення створено (очікує підтвердження готелю)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "200":
          description: Підключення вже існує — повертається поточний стан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Onboarding]
      summary: Список підключень провайдера (опц. за готелем/статусом)
      parameters:
        - name: property_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, rejected, disconnected] }
      responses:
        "200":
          description: Підключення
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /connections/{connection_id}:
    get:
      tags: [Onboarding]
      summary: Статус підключення (опитувати до active)
      description: >
        PMS/CM опитує до `status = active`. Або підпишіться на webhook
        `connection.*`, щоб отримати сповіщення, коли готель підтвердить.
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Стан підключення
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Onboarding]
      summary: Відключити (припинити синхронізацію готелю)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        "200":
          description: Відключено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /properties/{property_id}/rooms:
    get:
      tags: [Onboarding]
      summary: Каталог категорій номерів Unit.Travel (для маппінгу)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список категорій
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/rate-plans:
    get:
      tags: [Onboarding]
      summary: Каталог тарифних планів Unit.Travel (для маппінгу)
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список тарифів
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RatePlan' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /properties/{property_id}/mappings:
    get:
      tags: [Onboarding]
      summary: Поточні відповідності зовнішніх кодів партнера нашим id
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        "200":
          description: Список маппінгів
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mapping' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Onboarding]
      summary: Задати/оновити відповідності кодів (idempotent upsert)
      description: >
        Партнер надсилає відповідність СВОЇХ кодів номерів/тарифів нашим
        `room_id` / `rate_plan_id`. Потрібно до надсилання ARI: елементи ARI з
        невідомим кодом будуть відхилені.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Mapping' }
      responses:
        "200":
          description: Маппінги збережено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /ari:
    post:
      tags: [ARI]
      summary: Приймання ARI-оновлення (наявність + ціни + обмеження)
      description: >
        Єдине batch-повідомлення. Ідемпотентне за `message_uid`. Відповідає
        `202 Accepted`; фактичне застосування — асинхронне, статус через
        `GET /ari/messages/{message_uid}`.

        ОДИН готель — задайте `property_id` і будь-які з масивів `availability` /
        `rates` / `restrictions` (щонайменше один непорожній). КІЛЬКА готелів —
        використайте `items[]`, де кожен елемент несе свій `property_id` і масиви.

        Ціни підтримують дві моделі (див. `RateItem.pricing_model`): `per_room`
        (одна ціна на зв'язку room+rate) та `per_guest` (`occupancy_prices[]` —
        абсолютна ціна для кожної кількості гостей).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AriMessage' }
            examples:
              perRoom:
                $ref: '#/components/examples/AriPerRoom'
              perGuest:
                $ref: '#/components/examples/AriPerGuest'
              multiProperty:
                $ref: '#/components/examples/AriMultiProperty'
      responses:
        "202":
          description: Повідомлення прийнято в обробку
          headers:
            Location:
              description: URL для опитування статусу
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriAccepted' }
        "200":
          description: >
            Повтор із вже баченим `message_uid` — повертається попередній
            результат без повторного застосування (ідемпотентність).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Unprocessable' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /ari/messages/{message_uid}:
    get:
      tags: [ARI]
      summary: Статус обробки ARI-повідомлення
      parameters:
        - name: message_uid
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AriMessageStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /reservations:
    get:
      tags: [Reservations]
      summary: Видача нових/змінених/скасованих бронювань (pull)
      description: >
        Для PMS/CM, що забирають бронювання опитуванням. Посторінково, за
        курсором. Альтернатива — webhook (див. README та `ReservationEvent`).

        Гості: у відповіді завжди є `primary_guest` (контакти + національність).
        Готелі, яким потрібні імена ВСІХ гостей, додатково отримують
        необов'язковий масив `guests[]`, де кожен гість прив'язаний до номера
        через `room_index` (актуально для multi-room бронювань).
      parameters:
        - $ref: '#/components/parameters/PropertyId2'
        - name: since
          in: query
          description: Повернути бронювання, змінені з цього моменту (ISO 8601)
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, modified, cancelled]
        - name: cursor
          in: query
          description: Курсор наступної сторінки (з попередньої відповіді)
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Сторінка бронювань
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationList' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /reservations/{reservation_id}/acknowledge:
    post:
      tags: [Reservations]
      summary: Підтвердити приймання бронювання партнером
      description: >
        Після успішного завантаження бронювання в PMS/CM підтвердіть його, щоб
        воно не повторювалося у pull-видачі. Для webhook підтвердженням є `200`.
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Підтверджено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        ЄДИНИЙ спільний API-ключ видається Unit.Travel на ПРОВАЙДЕРА (весь
        PMS/CM), а не на кожен готель. Передається заголовком `X-API-Key: <key>`.
        Кожен запит щодо конкретного готелю несе `property_id` і працює лише
        коли підключення готелю у статусі `active` (див. `POST /connections`).
        Опційно — IP-allowlist. Перевірка ключа — `GET /ping`.

  parameters:
    PropertyId:
      name: property_id
      in: path
      required: true
      description: Ідентифікатор об'єкта розміщення в Unit.Travel
      schema: { type: integer, format: int64 }
    PropertyId2:
      name: property_id
      in: query
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Необов'язковий дубль `message_uid` з тіла (якщо задано — має збігатися).
        Забезпечує захист від повторів на рівні транспорту.
      schema: { type: string, maxLength: 120 }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: Ідентифікатор підключення з POST /connections
      schema: { type: string }

  responses:
    Unauthorized:
      description: Відсутній або невірний API-ключ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Об'єкт не знайдено (невідомий id / поза областю видимості провайдера)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Некоректний запит (структура тіла/параметрів або валідація)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: >
        Семантична помилка: невідомий код номера/тарифу, некоректний діапазон
        дат, застарілий `revision` тощо.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Перевищено ліміт запитів
      headers:
        Retry-After:
          description: Через скільки секунд повторити
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        Підключення готелю для цього property не активне
        (pending/rejected/disconnected). Довідники, маппінг та ARI доступні
        лише для активного підключення (див. POST /connections).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: connection_not_active
        message:
          type: string
          example: "connection for property 123 is not active"
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: "rates[3].rate_plan_code" }
              reason: { type: string }

    Ack:
      type: object
      properties:
        status: { type: string, example: ok }

    Room:
      type: object
      description: Категорія номера (одиниця інвентарю/наявності).
      properties:
        id: { type: integer, format: int64, example: 4500 }
        code: { type: string, example: "DLX" }
        name: { type: string, example: "Deluxe Room" }
        base_occupancy:
          type: integer
          description: Стандартна кількість гостей, яку покриває базова ціна
          example: 2
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: >
            Як тарифікується номер — `per_room` (не залежить від кількості
            гостей) або `per_guest` (ціна залежить від кількості гостей).
            ARI-оновлення цін має відповідати цій моделі.
          example: per_room
        max_adults: { type: integer, example: 3 }
        max_children: { type: integer, example: 2 }
        max_infants: { type: integer, example: 1 }
        max_occupancy: { type: integer, example: 4 }

    RatePlan:
      type: object
      properties:
        id: { type: integer, format: int64, example: 13500 }
        code: { type: string, example: "STD-BB-FLEX" }
        name: { type: string, example: "Standard BB Flexible" }
        room_id: { type: integer, format: int64, example: 4500 }
        board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
        currency: { type: string, example: "EUR" }
        is_refundable: { type: boolean, example: true }
        is_private_rate:
          type: boolean
          description: Приватний/negotiated тариф (видно лише за акаунтом/кодом доступу)
          example: false
        is_package_rate:
          type: boolean
          description: Пакетний тариф (у зв'язці з дод. послугами)
          example: false
        parent_rate_id:
          type: integer
          format: int64
          nullable: true
          description: Для похідного (derive) тарифу — id батьківського тарифу
          example: null

    Mapping:
      type: object
      required: [entity_type, external_code, internal_id]
      properties:
        entity_type:
          type: string
          enum: [room, rate_plan]
        external_code:
          type: string
          description: Код на стороні партнера (PMS/CM)
          example: "SRV-ROOM-01"
        internal_id:
          type: integer
          format: int64
          description: id номера/тарифу в Unit.Travel (room_id / rate_plan_id)
          example: 4500

    AriMessage:
      type: object
      required: [message_uid]
      description: >
        Вкажіть АБО верхньорівневий `property_id` + масиви (один готель), АБО
        `items[]` (кілька готелів). `message_uid` обов'язковий завжди.
      properties:
        message_uid:
          type: string
          maxLength: 120
          description: Унікальний id повідомлення в межах підключення (захист від повторів)
          example: "srv-2026-07-01T10:00:00-abc123"
        revision:
          type: integer
          format: int64
          description: >
            Монотонний лічильник/мітка часу джерела для last-write-wins.
            Застосовується лише якщо не старіший за збережений.
          example: 1719827400
        property_id:
          type: integer
          format: int64
          description: Скорочена форма для одного готелю (не вказувати при items[])
          example: 123
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }
        items:
          type: array
          description: Батч по кількох готелях — кожен елемент оновлює один готель.
          items: { $ref: '#/components/schemas/AriPropertyBatch' }

    AriPropertyBatch:
      type: object
      required: [property_id]
      properties:
        property_id: { type: integer, format: int64, example: 123 }
        availability:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/RateItem' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/RestrictionItem' }

    AvailabilityItem:
      type: object
      required: [date_from, date_to, units]
      description: >
        Наявність («rooms to sell») на категорію номера. Ідентифікуйте номер
        через `room_code` та/або `room_id` (хоча б один). Зберігається як
        аллотмент; фактична доступність = units − наші підтверджені бронювання.
      properties:
        room_code: { type: string, description: зовнішній код номера, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, description: id номера в Unit.Travel, example: 4500 }
        date_from: { type: string, format: date, example: "2026-07-01" }
        date_to:   { type: string, format: date, description: включно, example: "2026-07-31" }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        units:
          type: integer
          minimum: 0
          description: Кількість номерів до продажу
          example: 5
        closed:
          type: boolean
          description: Повний stop-sell на категорію (перекриває units)
          default: false

    RateItem:
      type: object
      required: [date_from, date_to, currency]
      description: >
        Ціна на зв'язку room + rate. Ідентифікуйте зв'язку кодами
        (`room_code` + `rate_plan_code`) та/або нашими id (`room_id` +
        `rate_plan_id`); тариф обов'язковий, а `room_*` прив'язує ціну до
        конкретного номера (ціни зазвичай ставляться на зв'язку room+rate).
        Нетто, без податків/зборів. Дві моделі:
          * per_room  — одна `price` за ніч (не залежить від кількості гостей);
          * per_guest — `occupancy_prices[]`: абсолютна ціна за ніч для кожної
            кількості гостей.
        Дитячі ціни задаються окремо (Child rates), в ARI не передаються.
      properties:
        room_code: { type: string, example: "SRV-ROOM-01" }
        room_id:   { type: integer, format: int64, example: 4500 }
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: включно }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        pricing_model:
          type: string
          enum: [per_room, per_guest]
          description: Має збігатися з pricing_model номера.
          example: per_room
        price:
          type: number
          format: double
          description: "Модель per_room: ціна за ніч на зв'язку room+rate"
          example: 120.00
        occupancy_prices:
          type: array
          description: "Модель per_guest: абсолютна ціна за ніч для кожної кількості гостей"
          items:
            type: object
            required: [occupancy, price]
            properties:
              occupancy: { type: integer, description: кількість гостей (дорослих), example: 2 }
              price: { type: number, format: double, example: 120.00 }
        currency: { type: string, example: "EUR" }

    RestrictionItem:
      type: object
      required: [date_from, date_to]
      description: >
        Обмеження тарифу. Ідентифікуйте його через `rate_plan_code` та/або
        `rate_plan_id` (хоча б один).
      properties:
        rate_plan_code: { type: string, example: "STD-BB-FLEX" }
        rate_plan_id:   { type: integer, format: int64, example: 13500 }
        date_from: { type: string, format: date }
        date_to:   { type: string, format: date, description: включно }
        days_of_week:
          $ref: '#/components/schemas/DaysOfWeek'
        min_stay: { type: integer, minimum: 1, example: 2 }
        max_stay: { type: integer, description: "0 = без обмеження", example: 0 }
        closed_to_arrival:   { type: boolean, default: false }
        closed_to_departure: { type: boolean, default: false }
        stop_sell:           { type: boolean, default: false }
        min_advance_days:    { type: integer, minimum: 0, example: 0 }
        max_advance_days:    { type: integer, minimum: 0, description: "0 = немає", example: 0 }
        release_days:        { type: integer, minimum: 0, example: 0 }

    DaysOfWeek:
      type: array
      description: >
        Дні тижня, на які діє елемент. Якщо не задано — усі дні.
      items:
        type: string
        enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
      example: [MON, TUE, WED, THU, FRI]

    AriAccepted:
      type: object
      properties:
        message_uid: { type: string }
        status: { type: string, enum: [received], example: received }
        received_at: { type: string, format: date-time }

    AriMessageStatus:
      type: object
      properties:
        message_uid: { type: string }
        status:
          type: string
          enum: [received, processing, applied, failed, skipped]
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        applied_items: { type: integer, example: 62 }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Error' }

    ReservationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
        next_cursor:
          type: string
          nullable: true
          description: Курсор наступної сторінки; null — даних більше немає

    Reservation:
      type: object
      description: >
        Бронювання, що віддається партнеру. Номер/тариф вказані і нашими id
        (`room_id`/`rate_plan_id`), і кодами партнера (`room_code`/
        `rate_plan_code`). `primary_guest` завжди несе контакти; необов'язковий
        `guests[]` перелічує всіх гостей з прив'язкою до номерів, якщо готель
        цього вимагає.
      properties:
        reservation_id: { type: string, example: "UT-9F3A21" }
        property_id: { type: integer, format: int64, example: 123 }
        status:
          type: string
          enum: [new, modified, cancelled]
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        checkin: { type: string, format: date }
        checkout: { type: string, format: date }
        currency: { type: string, example: "EUR" }
        total_price: { type: number, format: double, example: 675.00 }
        rate_type:
          type: string
          enum: [gross, net]
          description: >
            gross — ціна включає комісію (див. `commission`); net — вже нетто,
            без комісії.
          example: net
        commission:
          type: string
          description: >
            Розмір комісії у вільному тексті для GROSS-цін (напр. "15%" або
            "101.25 EUR"); для net не вказується/ігнорується.
          example: null
        channel: { type: string, example: "web" }
        special_request:
          type: string
          description: Побажання гостя у вільному тексті (best effort, не гарантується)
          example: "Пізній заїзд ~23:00, за можливості високий поверх"
        rooms:
          type: array
          items:
            type: object
            properties:
              room_code: { type: string, description: код партнера (після маппінгу), example: "SRV-ROOM-01" }
              room_id: { type: integer, format: int64, example: 4500 }
              rate_plan_code: { type: string, example: "STD-BB-FLEX" }
              rate_plan_id: { type: integer, format: int64, example: 13500 }
              board: { type: string, enum: [RO, BB, HB, FB, AI], example: BB }
              is_refundable: { type: boolean, example: true }
              cancellation_policy:
                type: string
                description: Умови ануляції у вільному тексті (нон-реф, якщо не поверненний)
                example: "Безкоштовне скасування до 2026-07-08 18:00; далі штраф 1 ніч"
              occupancy:
                type: object
                properties:
                  adults: { type: integer, example: 2 }
                  children_ages:
                    type: array
                    items: { type: integer }
                    example: [6, 8]
                  infants: { type: integer, example: 0 }
              price: { type: number, format: double, example: 675.00 }
        primary_guest:
          type: object
          description: Головний гість — завжди присутній, несе контакти.
          required: [last_name]
          properties:
            first_name: { type: string, example: "Ivan" }
            last_name: { type: string, example: "Petrenko" }
            email: { type: string, format: email, example: "ivan@example.com" }
            phone: { type: string, example: "+380671234567" }
            nationality: { type: string, description: ISO 3166-1 alpha-2, example: "UA" }
        guests:
          type: array
          description: >
            Необов'язковий повний список гостей (деякі готелі вимагають імена
            всіх гостей). Кожен гість прив'язаний до номера через `room_index`
            (0-based індекс у `rooms[]`). Опускається, якщо потрібен лише головний.
          items:
            type: object
            properties:
              first_name: { type: string }
              last_name: { type: string }
              type: { type: string, enum: [adult, child], example: adult }
              room_index: { type: integer, description: "індекс у rooms[]", example: 0 }
        payment:
          type: object
          description: >
            Необов'язкові дані оплати / гарантії. `method` — ЯК здійснено
            (буде здійснено) оплату. Дані картки — PCI-чутливі; надсилайте лише
            узгодженим захищеним каналом, зазвичай токенізовані/масковані.
          properties:
            type:
              type: string
              enum: [guarantee, prepaid, deposit, pay_at_hotel]
              example: guarantee
            method:
              type: string
              description: Як здійснюється/здійснено оплату
              example: "віртуальна картка"
            card:
              type: object
              description: Необов'язкова картка для гарантії/оплати (PCI-чутливо)
              properties:
                holder: { type: string, example: "IVAN PETRENKO" }
                number: { type: string, description: PAN або токен/маска, example: "411111******1111" }
                expiry_month: { type: integer, example: 11 }
                expiry_year: { type: integer, example: 2027 }
                cvc: { type: string, example: "***" }
                brand: { type: string, example: "VISA" }

    ConnectionRequest:
      type: object
      required: [property_id]
      properties:
        property_id:
          type: integer
          format: int64
          description: property_id з Extranet Unit.Travel, скопійований готелем
          example: 123
        external_property_code:
          type: string
          description: Код об'єкта на стороні партнера (PMS/CM)
          example: "SRV-HOTEL-777"
        note:
          type: string
          description: Необов'язкова примітка, що показується готелю при підтвердженні

    Connection:
      type: object
      properties:
        connection_id: { type: string, example: "conn_01HQ4Z9..." }
        property_id: { type: integer, format: int64, example: 123 }
        external_property_code: { type: string, nullable: true, example: "SRV-HOTEL-777" }
        status:
          type: string
          enum: [pending, active, rejected, disconnected]
          description: >
            pending — очікує підтвердження готелю в Extranet; active —
            підтверджено, довідники/маппінг/ARI відкриті; rejected — готель
            відхилив; disconnected — підключення завершено.
        scope:
          type: object
          description: Що дозволено цьому підключенню (задається на стороні Unit.Travel)
          properties:
            rates: { type: boolean, example: true }
            availability: { type: boolean, example: true }
            restrictions: { type: boolean, example: true }
        requested_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }

    ConnectionEvent:
      type: object
      description: >
        Webhook (Unit.Travel → endpoint партнера) при зміні готелем статусу
        підключення в Extranet. Підписується `X-UnitTravel-Signature`
        (HMAC-SHA256). На `connection.activated` PMS/CM може починати синхро.
      properties:
        event:
          type: string
          enum: [connection.activated, connection.rejected, connection.disconnected]
        occurred_at: { type: string, format: date-time }
        connection: { $ref: '#/components/schemas/Connection' }

    ReservationEvent:
      type: object
      description: >
        Тіло webhook-сповіщення (Unit.Travel → endpoint партнера).
        Підписується заголовком `X-UnitTravel-Signature` (HMAC-SHA256).
      properties:
        event:
          type: string
          enum: [reservation.created, reservation.modified, reservation.cancelled]
        occurred_at: { type: string, format: date-time }
        reservation: { $ref: '#/components/schemas/Reservation' }

  examples:
    AriPerRoom:
      summary: Один готель, ціна ЗА НОМЕР (per_room)
      value:
        message_uid: "ari-2026-07-01T10:00:00Z-000187"
        revision: 1719827400
        property_id: 123
        availability:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            units: 5
        rates:
          - room_code: "SRV-ROOM-01"
            room_id: 4500
            rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_room
            price: 120.00
            currency: "EUR"
        restrictions:
          - rate_plan_code: "STD-BB-FLEX"
            rate_plan_id: 13500
            date_from: "2026-07-01"
            date_to: "2026-07-14"
            min_stay: 2
            closed_to_arrival: true
    AriPerGuest:
      summary: Один готель, ціна ЗА ГОСТЕЙ (occupancy prices)
      value:
        message_uid: "ari-2026-07-01T10:05:00Z-000188"
        revision: 1719827700
        property_id: 123
        rates:
          - room_code: "SRV-ROOM-02"
            room_id: 4501
            rate_plan_code: "STD-RO-FLEX"
            rate_plan_id: 13510
            date_from: "2026-07-01"
            date_to: "2026-07-31"
            pricing_model: per_guest
            occupancy_prices:
              - { occupancy: 1, price: 80.00 }
              - { occupancy: 2, price: 120.00 }
              - { occupancy: 3, price: 150.00 }
            currency: "EUR"
    AriMultiProperty:
      summary: Кілька готелів в одному повідомленні (items[])
      value:
        message_uid: "ari-2026-07-01T10:10:00Z-000190"
        revision: 1719828000
        items:
          - property_id: 123
            availability:
              - { room_id: 4500, date_from: "2026-07-01", date_to: "2026-07-31", units: 5 }
          - property_id: 456
            rates:
              - room_id: 8800
                rate_plan_id: 22000
                date_from: "2026-07-01"
                date_to: "2026-07-31"
                pricing_model: per_room
                price: 99.00
                currency: "EUR"
